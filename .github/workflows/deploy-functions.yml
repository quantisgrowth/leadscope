name: Publicar funções do LeadScope

on:
  workflow_dispatch:
    inputs:
      sqls_applied:
        description: Os SQLs 01 e 02 já foram aplicados com sucesso no Supabase?
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: leadscope-production-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Conferir confirmação e branch
        env:
          SQLS_APPLIED: ${{ inputs.sqls_applied }}
        run: |
          if [ "$SQLS_APPLIED" != "true" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Execute apenas na main, após aplicar os dois SQLs com sucesso."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testes locais sem serviços externos
        run: |
          node tests/phase4.mjs
          node tests/team-and-history.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Publicar as seis funções com autenticação habilitada
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Cadastre SUPABASE_ACCESS_TOKEN em Settings > Secrets and variables > Actions."
            exit 1
          fi
          supabase functions deploy --help
          for function_name in search-places search-google-places reanalyze-opportunities audit-site validate-cnpj team-invitations; do
            supabase functions deploy "$function_name" --project-ref nlzlbrfwaloyxksaevne
          done
      - name: Conferir inicialização e comunicação com o navegador
        run: node tests/deployment-smoke.mjs
      - name: Registrar resultado
        run: |
          echo "As seis funções foram publicadas a partir do commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          echo "Nenhum SQL foi executado, convite enviado ou teste com Apify iniciado por este fluxo." >> "$GITHUB_STEP_SUMMARY"
          echo "O envio de convites ainda depende dos Secrets de e-mail no Supabase e de um remetente autorizado." >> "$GITHUB_STEP_SUMMARY"
