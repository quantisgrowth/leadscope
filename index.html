<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LeadScope — Inteligência comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070A;
  --surface:#071827;
  --card:#0D1D2A;
  --blue:#3478F6;
  --blue-light:#66A3FF;
  --text:#F5F7FA;
  --text-secondary:#87919C;
  --border:#1D3344;
  --warn:#F59E0B;
  --error:#EF4444;
  --radius:12px;
  --gray-badge:#2A3B48;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
html,body{height:100%;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.font-head{font-family:'Manrope',Inter,system-ui,sans-serif;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:rgba(52,120,246,.35);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#152531;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- utility ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 16px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--text);font-size:14px;font-weight:600;
  cursor:pointer;transition:background .15s,border-color .15s,transform .1s;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn:hover{border-color:#2a4457;background:rgba(255,255,255,.03);}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;}
.btn-primary:hover{background:#2864e0;border-color:#2864e0;}
.btn-ghost{border-color:transparent;}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:7px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.input, select.input, textarea.input{
  width:100%;background:#08131c;border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none;
}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(52,120,246,.18);}
.password-field{position:relative;}
.password-field .input{padding-right:46px;}
.password-toggle{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:transparent;color:var(--text-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:7px;}
.password-toggle:hover,.password-toggle:focus-visible{color:var(--text);background:rgba(255,255,255,.05);outline:none;}
.text-action{font-size:12.5px;color:var(--blue-light);cursor:pointer;background:none;border:0;padding:0;font-family:inherit;}
.text-action:hover{text-decoration:underline;}
.label{font-size:12.5px;color:var(--text-secondary);font-weight:600;margin-bottom:6px;display:block;letter-spacing:.01em;}
.field{margin-bottom:14px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
.card-title{font-size:15px;font-weight:700;margin:0 0 4px;}
.card-sub{font-size:13px;color:var(--text-secondary);margin:0 0 14px;}
.muted{color:var(--text-secondary);}
.row{display:flex;align-items:center;}
.gap-8{gap:8px;} .gap-12{gap:12px;} .gap-16{gap:16px;}
.between{justify-content:space-between;}
.wrap{flex-wrap:wrap;}
.grid{display:grid;gap:16px;}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--border);color:var(--text-secondary);background:rgba(255,255,255,.02);}
.badge-blue{background:rgba(52,120,246,.14);border-color:rgba(52,120,246,.35);color:var(--blue-light);}
.badge-warn{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.35);color:var(--warn);}
.badge-error{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.35);color:#ff8080;}
.badge-gray{background:rgba(135,145,156,.12);}
.divider{height:1px;background:var(--border);margin:16px 0;border:none;}
.icon{width:18px;height:18px;flex:0 0 auto;display:inline-block;}
.skeleton{background:linear-gradient(90deg,#0c1c28 25%,#122535 37%,#0c1c28 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:6px;}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.tooltip{position:relative;}
.tooltip:hover .tooltip-bubble{opacity:1;transform:translateY(0) translateX(-50%);pointer-events:auto;}
.tooltip-bubble{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateY(4px) translateX(-50%);
  background:#0c1e2c;border:1px solid var(--border);color:var(--text);font-size:12px;font-weight:500;
  padding:8px 10px;border-radius:8px;white-space:nowrap;opacity:0;transition:.15s;z-index:40;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.toast-wrap{position:fixed;top:calc(20px + env(safe-area-inset-top,0px));right:20px;z-index:300;display:flex;flex-direction:column;gap:10px;max-width:360px;width:calc(100% - 40px);pointer-events:none;}
.toast{background:#0c1e2c;border:1px solid var(--border);border-left:3px solid var(--blue);padding:13px 16px;border-radius:9px;font-size:13.5px;font-weight:500;box-shadow:0 14px 34px rgba(0,0,0,.5);animation:toastin .22s cubic-bezier(.2,.9,.3,1.2);display:flex;align-items:flex-start;gap:10px;pointer-events:auto;position:relative;overflow:hidden;}
.toast .toast-check{width:20px;height:20px;border-radius:50%;background:rgba(52,120,246,.18);color:var(--blue-light);display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px;}
.toast .toast-check svg{width:12px;height:12px;}
.toast .toast-bar{position:absolute;left:0;bottom:0;height:2px;background:var(--blue);animation:toastbar 3.2s linear forwards;}
@keyframes toastin{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastbar{from{width:100%}to{width:0%}}
@media (max-width:520px){.toast-wrap{right:10px;left:10px;width:auto;max-width:none;}}
.btn-flash{background:var(--blue) !important;border-color:var(--blue) !important;color:#fff !important;}
.empty{text-align:center;padding:48px 20px;color:var(--text-secondary);}
.empty h4{color:var(--text);margin:10px 0 6px;font-size:15px;}
.empty p{margin:0 0 16px;font-size:13.5px;}
.slider{-webkit-appearance:none;width:100%;height:5px;border-radius:4px;background:var(--border);outline:none;}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--blue);cursor:pointer;border:2px solid #0a1a26;}
.slider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--blue);cursor:pointer;border:2px solid #0a1a26;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;}
.tab{padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab.active{color:var(--text);border-color:var(--blue);}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-secondary);padding:6px 0;}
.checkbox-row input{accent-color:var(--blue);width:15px;height:15px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;color:var(--text-secondary);font-weight:600;font-size:12px;text-transform:none;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr.row-hover:hover{background:rgba(255,255,255,.015);}
.table-scroll{overflow-x:auto;}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#1b3d6d);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#fff;flex:0 0 auto;}
.donut-label{font-family:'Manrope';font-weight:800;}
.pill-group{display:flex;gap:6px;flex-wrap:wrap;}
.pill{padding:6px 12px;border-radius:999px;border:1px solid var(--border);font-size:12.5px;cursor:pointer;color:var(--text-secondary);background:transparent;}
.pill.active{background:rgba(52,120,246,.14);border-color:var(--blue);color:var(--blue-light);}

/* ---------- app shell ---------- */
.app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:256px;background:var(--surface);border-right:1px solid var(--border);
  position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;
  padding-top:calc(20px + env(safe-area-inset-top,0px));z-index:50;transition:transform .2s ease;
}
.sidebar-logo{padding:0 22px 22px;display:flex;align-items:center;gap:10px;}
.sidebar-logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--blue),#12335c);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.sidebar-logo b{font-size:17px;font-weight:800;letter-spacing:-.01em;}
.nav-scroll{flex:1;overflow-y:auto;padding-bottom:10px;}
.nav-section-label{padding:14px 22px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#3f5468;font-weight:700;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 22px;color:var(--text-secondary);
  cursor:pointer;border-left:3px solid transparent;font-size:14px;font-weight:500;
}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.02);}
.nav-item.active{color:var(--text);background:rgba(52,120,246,.1);border-left-color:var(--blue);font-weight:600;}
.sidebar-footer{border-top:1px solid var(--border);padding:16px 22px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));}
.sidebar-user{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.sidebar-user .meta{min-width:0;}
.sidebar-user .name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar-user .org{font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.plan-chip{font-size:11px;color:var(--blue-light);background:rgba(52,120,246,.12);padding:2px 8px;border-radius:6px;display:inline-block;margin-bottom:10px;}

.main{margin-left:256px;flex:1;display:flex;flex-direction:column;min-height:100vh;min-width:0;}
.topbar{
  height:64px;min-height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;
  padding:0 24px;position:sticky;top:0;background:rgba(5,7,10,.86);backdrop-filter:blur(8px);z-index:20;
  padding-top:env(safe-area-inset-top,0px);height:calc(64px + env(safe-area-inset-top,0px));
}
.search-box{flex:1;max-width:360px;display:flex;align-items:center;gap:8px;background:#08131c;border:1px solid var(--border);border-radius:8px;padding:8px 12px;}
.search-box input{background:transparent;border:none;outline:none;color:var(--text);font-size:13.5px;width:100%;}
.period-select{background:#08131c;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;background:transparent;cursor:pointer;color:var(--text-secondary);position:relative;flex:0 0 auto;}
.icon-btn:hover{color:var(--text);border-color:#2a4457;}
.dot-notif{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--warn);}
.hamburger{display:none;}
.content{padding:26px 28px 60px;flex:1;max-width:1400px;width:100%;}
.page-title{font-size:22px;font-weight:800;margin:0 0 4px;}
.page-sub{color:var(--text-secondary);font-size:13.5px;margin:0 0 22px;}

@media (max-width:960px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .hamburger{display:flex;}
  .search-box{display:none;}
  .content{padding:18px 16px 50px;}
  .sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45;}
  .sidebar-scrim.show{display:block;}
}

/* ---------- login ---------- */
.login-shell{min-height:100vh;display:flex;}
.login-form-side{flex:1;display:flex;align-items:center;justify-content:center;padding:32px;}
.login-brand-side{flex:1;background:linear-gradient(160deg,#081726 0%,#050b12 60%);border-left:1px solid var(--border);display:flex;align-items:center;justify-content:center;padding:60px;position:relative;overflow:hidden;}
.login-brand-side::before{content:"";position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(52,120,246,.16),transparent 65%);top:-150px;right:-150px;}
.login-box{width:100%;max-width:380px;}
.demo-box{background:rgba(52,120,246,.08);border:1px dashed rgba(52,120,246,.4);border-radius:8px;padding:12px 14px;font-size:12.5px;color:var(--blue-light);margin-top:18px;cursor:pointer;}
@media (max-width:860px){.login-brand-side{display:none;}}

/* ---------- onboarding ---------- */
.onb-shell{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px 80px;}
.onb-progress{width:100%;max-width:640px;display:flex;gap:8px;margin-bottom:36px;}
.onb-progress .seg{flex:1;height:4px;border-radius:4px;background:var(--border);}
.onb-progress .seg.done{background:var(--blue);}
.onb-card{width:100%;max-width:640px;}
.step-badge{font-size:12px;color:var(--blue-light);font-weight:700;margin-bottom:6px;}

/* ---------- diagnosis ---------- */
.diag-header{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;}
.evidence-item{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;background:rgba(255,255,255,.012);}
.evidence-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin-top:8px;}
.tone-tabs{display:flex;gap:6px;margin-bottom:12px;}
.message-box{background:#08131c;border:1px solid var(--border);border-radius:10px;padding:16px;font-size:14px;line-height:1.55;}
.stepper-progress{display:flex;flex-direction:column;gap:14px;max-width:440px;margin:0 auto;}
.stepper-item{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--text-secondary);}
.stepper-item .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
.stepper-item.active{color:var(--text);}
.stepper-item.active .dot{border-color:var(--blue);}
.stepper-item.done .dot{background:var(--blue);border-color:var(--blue);}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
.kpi-val{font-size:24px;font-weight:800;font-family:'Manrope';margin-top:4px;}
.kpi-label{font-size:12.5px;color:var(--text-secondary);}
.kpi-trend{font-size:11.5px;margin-top:6px;color:var(--blue-light);}
.boot-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
.boot-spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--blue);animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.auth-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);color:#ff9a9a;font-size:12.5px;padding:10px 12px;border-radius:8px;margin-bottom:14px;}
</style>
</head>

function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d; }
function slug(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'').slice(0,16); }

// Reconstrói os sinais completos (texto, fonte, interpretação, serviço) a partir
// das chaves salvas no banco (empresas.sinais_keys), evitando duplicar esses textos no schema SQL.
function sinaisFromKeys(keys){ return (keys||[]).map(k=>SIGNAL_POOL.find(s=>s.key===k)).filter(Boolean); }

// Converte uma linha da tabela `empresas` (+ suas `evidencias`) no formato que as telas usam.
function rowToCompany(row, evidenciaRows){
  const sinais = sinaisFromKeys(row.sinais_keys);
  const sourceLabel=row.source_provider==='google_maps'?'Google Maps via Apify':'Fonte pública';
  if(!sinais.length) sinais.push({key:'perfilPublico', texto:'Estabelecimento localizado em uma fonte pública', fonte:sourceLabel, interpretacao:'Há dados públicos suficientes para iniciar uma qualificação comercial', servico:4});
  const evidencias = (evidenciaRows||[]).map(e=>({
    texto:e.texto, fonte:e.fonte,
    data: e.data ? fmtDate(new Date(e.data+'T00:00:00')) : '',
    confianca:e.confianca,
  }));
  return {
    id:row.id, nome:row.nome, segmento:row.segmento, cidade:row.cidade, bairro:row.bairro, endereco:row.endereco,
    telefone:row.telefone, site:row.site, redes:row.redes||[], nota:row.nota, avaliacoes:row.avaliacoes,
    score:row.score, confianca:row.confianca, potencial:row.potencial,
    sinais, evidencias,
    interpretacoes:[...new Set(sinais.map(s=>s.interpretacao))].slice(0,3),
    servicoRecomendado: row.servico_recomendado,
    status: row.status,
    ultimaAtualizacao: row.ultima_atualizacao ? fmtDate(new Date(row.ultima_atualizacao+'T00:00:00')) : '',
    resultado: row.resultado,
    monitorada: !!row.monitorada,
    mensagemGerada: row.mensagem_gerada, mensagemTom: row.mensagem_tom || 'consultivo', mensagemUtilizada: !!row.mensagem_utilizada,
    perfil:{
      categoria:'Clínica odontológica', horarios:'Seg a sex, 8h às 19h',
      respondeuAvaliacoes: !sinais.some(s=>s.key==='semResposta'),
      completude: sinais.some(s=>s.key==='perfilIncompleto') ? 62 : 94,
    },
    siteInfo:{
      https:true, responsivo: !sinais.some(s=>s.key==='mobileRuim'),
      agendamento: !sinais.some(s=>s.key==='agendamento'),
      whatsappVisivel: !sinais.some(s=>s.key==='semWhats'),
      formularioOk: !sinais.some(s=>s.key==='formulario'),
      seoBasico: row.score>=55,
    },
    avaliacoesInfo:{
      sentimento: sinais.some(s=>s.key==='avaliacaoDemora') ? 'Misto' : 'Predominantemente positivo',
      temas: sinais.some(s=>s.key==='avaliacaoDemora') ? ['Tempo de espera','Atendimento','Preço'] : ['Atendimento','Qualidade','Ambiente'],
    },
    jornada:{
      etapas: sinais.some(s=>s.key==='agendamento') ? 4 : 2,
      whatsapp: !sinais.some(s=>s.key==='semWhats'),
      formulario: !sinais.some(s=>s.key==='formulario'),
      agendamentoOnline: !sinais.some(s=>s.key==='agendamento'),
    },
    presenca:{
      redesEncontradas: sinais.some(s=>s.key==='semPublicacao') ? ['Facebook'] : ['Instagram','Facebook'],
      frequencia: sinais.some(s=>s.key==='semPublicacao') ? 'Baixa (sem publicações recentes)' : 'Regular',
    },
  };
}

/* ================= SUPABASE: CARREGAR / GRAVAR DADOS ================= */
async function loadAllData(userId){
  const [{data:profile}, {data:settings}, {data:radaresRows}, {data:empresasRows}, {data:evidenciasRows}] = await Promise.all([
    sb.from('profiles').select('*').eq('id', userId).maybeSingle(),
    sb.from('account_settings').select('*').eq('user_id', userId).maybeSingle(),
    sb.from('radares').select('*').eq('user_id', userId).order('criado_em', {ascending:false}),
    sb.from('empresas').select('*').eq('user_id', userId).order('score', {ascending:false}),
    sb.from('evidencias').select('*').order('data', {ascending:false}),
  ]);
  const evByEmpresa = {};
  (evidenciasRows||[]).forEach(e=>{ (evByEmpresa[e.empresa_id] = evByEmpresa[e.empresa_id]||[]).push(e); });
  const companies = (empresasRows||[]).map(row => rowToCompany(row, evByEmpresa[row.id]));
  const ob = rowToOnboarding(settings) || state.onboarding;
  setState({
    userId,
    user: { nome: (profile&&profile.nome) || state.user.nome, empresa: ob.empresa || state.user.empresa,
      plano: (profile&&profile.plano) || 'Plano Piloto', email: (profile&&profile.email) || '',
      cargo: (profile&&profile.cargo) || 'Head Comercial' },
    onboarding: ob,
    onboarded: !!(settings && settings.onboarded),
    onboardStep: Math.max(1, Math.min(3, Number((settings&&settings.onboarding_step)||1))),
    companies,
    radars: (radaresRows||[]).map(r=>({id:r.id, nome:r.nome, segmento:r.segmento, cidade:r.cidade, query:r.query, localizacao:r.localizacao, status:r.status||'pendente', criadoEm: r.criado_em ? fmtDate(new Date(r.criado_em+'T00:00:00')) : ''})),
    loggedIn:true, booting:false,
  });
}

async function persistOnboarding(completed){
  if(!state.userId) return;
  const { error } = await sb.from('account_settings').update(Object.assign(onboardingToRow(state.onboarding), {
    onboarding_step:state.onboardStep, onboarded:!!completed, updated_at:new Date().toISOString()
  })).eq('user_id', state.userId);
  if(error) throw error;
}
async function persistSettingsPartial(){

}

/* ================= AUTENTICAÇÃO (Supabase Auth) ================= */
async function bootAuth(){
  const { data: { session } } = await sb.auth.getSession();
  if(passwordRecoveryPending){
    const email=(session&&session.user&&session.user.email)||state.authEmail;
    const authError=session?'': 'Este link de recuperação expirou ou já foi utilizado. Solicite um novo link.';
    history.replaceState({},document.title,window.location.pathname);
    setState({ booting:false, authChecked:true, loggedIn:false, authMode:'update', authEmail:email, authError });
    return;
  }
  if(session && session.user){
    await loadAllData(session.user.id);
  } else {
    setState({ booting:false, authChecked:true, loggedIn:false });
  }
}
sb.auth.onAuthStateChange((event, session)=>{
  if(event === 'PASSWORD_RECOVERY'){
    passwordRecoveryPending=true;
    setState({ loggedIn:false, authMode:'update', authEmail:(session&&session.user&&session.user.email)||state.authEmail, authLoading:false, authError:null, booting:false });
  } else if(event === 'SIGNED_OUT'){
    setState({ loggedIn:false, onboarded:false, companies:[], radars:[], userId:null, booting:false });
  } else if(event === 'SIGNED_IN' && session && session.user){
    if(passwordRecoveryPending){
      setState({ loggedIn:false, authMode:'update', authEmail:session.user.email||state.authEmail, authLoading:false, authError:null, booting:false });
    } else if(state.userId !== session.user.id){
      loadAllData(session.user.id);
    }
  }
});


function toast(msg){
  const wrap = document.getElementById('toastWrap');
  if(!wrap) return;
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = `<span class="toast-check">${icon('check')}</span><span style="flex:1;line-height:1.4;">${esc(msg)}</span><span class="toast-bar"></span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(-6px)'; el.style.transition='opacity .25s, transform .25s'; setTimeout(()=>el.remove(),260); }, 3200);
}
function flashButton(btn, text){
  if(!btn) return;
  if(btn._flashTimer) clearTimeout(btn._flashTimer);
  if(!btn.dataset.originalHtml) btn.dataset.originalHtml = btn.innerHTML;
  const original = btn.dataset.originalHtml;
  btn.disabled = true;
  btn.classList.add('btn-flash');
  btn.innerHTML = icon('check') + ' ' + text;
  btn._flashTimer = setTimeout(()=>{
    btn.innerHTML = original;
    btn.disabled = false;
    btn.classList.remove('btn-flash');
    delete btn.dataset.originalHtml;
  }, 1500);
}

/* ================= SVG CHART HELPERS ================= */
function barChartSVG(data, opts){
  opts = opts||{}; const w=opts.w||560,h=opts.h||200,pad=32;
  const max = Math.max(...data.map(d=>d.v))*1.15 || 1;
  const bw = (w-pad*1.5)/data.length;
  let bars='', labels='';
  data.forEach((d,i)=>{
    const bh = (d.v/max)*(h-46);
    const x = pad + i*bw + bw*0.18;
    const y = h-30-bh;
    bars += `<rect x="${x}" y="${y}" width="${bw*0.64}" height="${bh}" rx="4" fill="${d.color||'var(--blue)'}"/>
      <text x="${x+bw*0.32}" y="${y-6}" font-size="10.5" fill="#87919C" text-anchor="middle" font-family="Inter">${d.v}</text>`;
    labels += `<text x="${x+bw*0.32}" y="${h-10}" font-size="10.5" fill="#87919C" text-anchor="middle" font-family="Inter">${d.label}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    <line x1="${pad}" y1="${h-30}" x2="${w-8}" y2="${h-30}" stroke="#1D3344"/>
    ${bars}${labels}
  </svg>`;
}
function lineChartSVG(data, opts){
  opts=opts||{}; const w=opts.w||560,h=opts.h||200,pad=30;
  const max = Math.max(...data.map(d=>d.v))*1.2||1, min=0;
  const stepX = (w-pad*1.4)/(data.length-1);
  const pts = data.map((d,i)=>{
    const x = pad+i*stepX;
    const y = h-30-((d.v-min)/(max-min))*(h-46);
    return [x,y];
  });
  const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = path + ` L${pts[pts.length-1][0]},${h-30} L${pts[0][0]},${h-30} Z`;
  let dots='', labels='';
  pts.forEach((p,i)=>{
    dots += `<circle cx="${p[0]}" cy="${p[1]}" r="3.4" fill="#3478F6"/>`;
    labels += `<text x="${p[0]}" y="${h-10}" font-size="10.5" fill="#87919C" text-anchor="middle" font-family="Inter">${data[i].label}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    <defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3478F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3478F6" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="${pad}" y1="${h-30}" x2="${w-8}" y2="${h-30}" stroke="#1D3344"/>
    <path d="${area}" fill="url(#lg1)" stroke="none"/>
    <path d="${path}" fill="none" stroke="#3478F6" stroke-width="2.4"/>
    ${dots}${labels}
  </svg>`;
}
function donutSVG(score, size){
  size = size||132; const r=size/2-10, c=2*Math.PI*r, cx=size/2, cy=size/2;
  const cls = classificacao(score);
  const off = c*(1-score/100);
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" stroke="#1D3344" stroke-width="11" fill="none"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" stroke="${cls.color}" stroke-width="11" fill="none"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="${size*0.26}" fill="#F5F7FA" class="donut-label" font-family="Manrope">${score}</text>
    <text x="${cx}" y="${cy+18}" text-anchor="middle" font-size="10.5" fill="#87919C" font-family="Inter">/ 100</text>
  </svg>`;
}
function funnelSVG(stages){
  const w=760,h=stages.length*46+10; const max=stages[0].v;
  let out='';
  stages.forEach((s,i)=>{
    const pct = s.v/max;
    const barW = 200 + pct*(w-260);
    const y = i*46+8;
    out += `<rect x="0" y="${y}" width="${barW}" height="30" rx="6" fill="${i===0?'#3478F6':'rgba(102,163,255,'+(0.85-i*0.1)+')'}"/>
      <text x="14" y="${y+20}" font-size="12.5" fill="#04121e" font-weight="700" font-family="Inter">${s.label}</text>
      <text x="${barW+12}" y="${y+20}" font-size="12.5" fill="#F5F7FA" font-family="Inter">${s.v}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">${out}</svg>`;
}

        ${(!isSignup&&!isRecover&&!isUpdate)?`<div style="text-align:right;margin:-6px 0 14px;"><button type="button" class="text-action" id="forgotPassword">Esqueci minha senha</button></div>`:''}

        ${isUpdate?`<div style="text-align:center;margin-top:16px;"><button type="button" class="text-action" id="requestNewRecovery">Solicitar outro link de recuperação</button></div>`:''}

function bindLogin(){
  document.querySelectorAll('[data-toggle-password]').forEach(btn=>btn.addEventListener('click',()=>{
    const input=document.getElementById(btn.getAttribute('data-toggle-password'));
    const visible=input.type==='text'; input.type=visible?'password':'text';
    btn.setAttribute('aria-label',visible?'Mostrar senha':'Ocultar senha'); btn.title=visible?'Mostrar senha':'Ocultar senha';
  }));
  const toggle=document.getElementById('toggleAuthMode');
  if(toggle) toggle.addEventListener('click', ()=>{
    setState({authMode: state.authMode==='signin' ? 'signup' : 'signin', authError:null});
  });
  const emailInput=document.getElementById('loginEmail');
  if(emailInput) emailInput.addEventListener('input',()=>{ state.authEmail=emailInput.value; });
  const forgot=document.getElementById('forgotPassword');
  if(forgot) forgot.addEventListener('click',()=>setState({authMode:'recover',authEmail:(emailInput&&emailInput.value)||state.authEmail,authError:null}));
  const requestNew=document.getElementById('requestNewRecovery');
  if(requestNew) requestNew.addEventListener('click',()=>{
    passwordRecoveryPending=false;
    setState({authMode:'recover',authError:null,authLoading:false});
  });
  document.getElementById('loginBtn').addEventListener('click', async ()=>{
    if(state.authMode==='update'){
      const pass=document.getElementById('newPass').value, confirm=document.getElementById('confirmPass').value;
      if(pass!==confirm){ setState({authError:'As senhas não coincidem.'}); return; }
      if(!validStrongPassword(pass)){ setState({authError:'Use 8 caracteres ou mais, com maiúscula, minúscula, número e símbolo.'}); return; }
      setState({authLoading:true,authError:null});
      const { error }=await sb.auth.updateUser({password:pass});
      if(error){ setState({authLoading:false,authError:traduzErroAuth(error.message)}); return; }
      passwordRecoveryPending=false;
      history.replaceState({},document.title,window.location.pathname);
      await sb.auth.signOut();
      setState({authMode:'signin',authLoading:false,authError:null,loggedIn:false});
      toast('Senha atualizada. Entre novamente com a nova senha.');
      return;
    }
    const email = document.getElementById('loginEmail').value.trim();
    if(state.authMode==='recover'){
      if(!email){ setState({authError:'Informe o e-mail da sua conta.'}); return; }
      setState({authLoading:true,authError:null});
      const redirectTo=window.location.origin+window.location.pathname;
      const { error }=await sb.auth.resetPasswordForEmail(email,{redirectTo});
      if(error){ setState({authLoading:false,authError:traduzErroAuth(error.message)}); return; }
      setState({authLoading:false,authMode:'signin',authError:null});
      toast('Se o e-mail estiver cadastrado, enviaremos um link de recuperação.');
      return;
    }
    const pass = document.getElementById('loginPass').value;
    if(!email || !pass){ setState({authError:'Preencha e-mail e senha.'}); return; }
    if(state.authMode==='signup'&&!validStrongPassword(pass)){ setState({authError:'Use 8 caracteres ou mais, com maiúscula, minúscula, número e símbolo.'}); return; }
    setState({authLoading:true, authError:null});
    try{
      if(state.authMode==='signup'){
        const nome = (document.getElementById('loginNome')||{}).value || '';
        const { data, error } = await sb.auth.signUp({ email, password: pass, options:{ data:{ nome } } });
        if(error) throw error;
        if(data.session){
          await loadAllData(data.user.id);
          toast('Conta criada com sucesso. Bem-vindo(a)!');
        } else {
          setState({authLoading:false, authError:'Conta criada! Verifique seu e-mail para confirmar o acesso antes de entrar.'});
        }
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
        if(error) throw error;
        await loadAllData(data.user.id);
        toast('Bem-vindo de volta!');
      }
    }catch(e){
      setState({authLoading:false, authError: traduzErroAuth(e.message)});
    }
  });
}
function validStrongPassword(value){ return value.length>=8 && /[a-z]/.test(value) && /[A-Z]/.test(value) && /\d/.test(value) && /[^A-Za-z0-9]/.test(value); }
function traduzErroAuth(msg){
  if(!msg) return 'Não foi possível autenticar. Tente novamente.';
  if(/invalid login credentials/i.test(msg)) return 'E-mail ou senha incorretos.';
  if(/already registered|already exists/i.test(msg)) return 'Já existe uma conta com esse e-mail. Tente entrar.';
  if(/weak password|password.*(8|short)|characters/i.test(msg)) return 'Use 8 caracteres ou mais, com maiúscula, minúscula, número e símbolo.';
  if(/email not confirmed/i.test(msg)) return 'Confirme seu e-mail antes de entrar (verifique sua caixa de entrada).';
  return msg;
}

function bindOnboarding(){
  const ob = state.onboarding;
  const ids = {f_empresa:'empresa',f_site:'site',f_segmento:'segmento',f_cidade:'cidade',f_servico:'servico',f_ticket:'ticket',f_descricao:'descricao',f_problema:'problema',f_segdes:'segmentosDesejados',f_regiao:'regiao',f_palavras:'palavrasChave',f_qtd:'qtdOportunidades'};

  const porte = document.getElementById('f_porte');
  if(porte) porte.addEventListener('change', ()=>{ ob.porte = porte.value; });
  const back = document.getElementById('obBack');
  if(back) back.addEventListener('click', ()=> setState({onboardStep: Math.max(1, state.onboardStep-1)}));
  document.getElementById('obNext').addEventListener('click', async ()=>{

      if(state.onboardStep<3){ state.onboardStep++; await persistOnboarding(false); setState({}); }

      btn.disabled=false; btn.textContent=state.onboardStep===3?'Configurar primeiro radar':'Salvar e continuar';

function bindRadarProcessing(){
  const btn = document.getElementById('runRadar');
  if(!btn) return;
  btn.addEventListener('click', async ()=>{
    const nome=document.getElementById('rNome').value.trim();
    const segmento=document.getElementById('rSegmento').value.trim();
    const localizacao=document.getElementById('rLocalizacao').value.trim();
    const palavras=document.getElementById('rPalavras').value.trim();
    const limite=Number(document.getElementById('rQuantidade').value)||20;
    const raio=Number(document.getElementById('rRaio').value)||15000;
    if(!nome||!segmento||!localizacao){ toast('Informe o nome, o segmento e a localização do radar.'); return; }
    const steps = ['Localizando empresas','Verificando presença digital','Analisando site e avaliações','Calculando potencial comercial','Preparando recomendações'];
    const wrap = document.getElementById('processingModalWrap');
    let i=0, timer;
    function paint(){
      wrap.innerHTML = `
      <div style="position:fixed;inset:0;background:rgba(3,6,10,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;">
        <div class="card" style="width:100%;max-width:420px;">
          <div class="card-title">Analisando oportunidades</div>
          <p class="card-sub">Isso pode levar alguns instantes.</p>
          <div class="stepper-progress">
            ${steps.map((s,idx)=>`
              <div class="stepper-item ${idx<i?'done':idx===i?'active':''}">
                <span class="dot">${idx<i?icon('check'):''}</span> ${s}
              </div>`).join('')}
          </div>
        </div>
      </div>`;
    }
    paint();
    timer=setInterval(()=>{ i=Math.min(i+1,steps.length-1); paint(); },900);
    try{
      const query=[segmento,palavras].filter(Boolean).join(' ');
      const { data:radar, error:radarError }=await sb.from('radares').insert({
        user_id:state.userId,nome,segmento,cidade:localizacao,query,localizacao,raio_metros:raio,
        limite_resultados:limite,status:'pendente',fonte:'apify_google_maps'
      }).select().single();
      if(radarError) throw radarError;
      const { data:startData, error:startError }=await sb.functions.invoke('search-places',{body:{action:'start',radar_id:radar.id,query,location:localizacao,result_limit:limite}});
      if(startError){
        let message=startError.message;
        if(startError.context&&typeof startError.context.json==='function'){
          try{ const details=await startError.context.json(); message=details.error||details.message||message; }catch(ignore){}
        }
        throw new Error(message);
      }
      if(startData&&startData.error) throw new Error(startData.error);
      if(!startData||!startData.run_id) throw new Error('A coleta não retornou uma identificação para acompanhamento.');

      let data=startData;
      const deadline=Date.now()+180000;
      while(data.status!=='concluido'){
        if(Date.now()>deadline) throw new Error('A coleta continua processando. Consulte este radar novamente em alguns instantes.');
        await new Promise(resolve=>setTimeout(resolve,3000));
        const { data:statusData, error:statusError }=await sb.functions.invoke('search-places',{body:{action:'status',run_id:startData.run_id}});
        if(statusError){
          let message=statusError.message;
          if(statusError.context&&typeof statusError.context.json==='function'){
            try{ const details=await statusError.context.json(); message=details.error||details.message||message; }catch(ignore){}
          }
          throw new Error(message);
        }
        if(statusData&&statusData.error) throw new Error(statusData.error);
        data=statusData||{};
      }
      clearInterval(timer); wrap.innerHTML='';
      await loadAllData(state.userId);
      toast('Radar concluído: '+Number((data&&data.found)||0)+' empresas encontradas.');
      navigate('#/oportunidades');
    }catch(e){
      clearInterval(timer); wrap.innerHTML='';
      toast('Não foi possível concluir o radar: '+(e.message||'tente novamente.'));
    }
  });
}

function bindDiagnostico(){
  document.querySelectorAll('[data-tone]').forEach(el=>{
    el.addEventListener('click', ()=> setState({diagTone: el.getAttribute('data-tone')}));
  });
  document.querySelectorAll('[data-detail]').forEach(el=>{
    el.addEventListener('click', ()=> setState({detailTab: el.getAttribute('data-detail')}));
  });
  document.querySelectorAll('[data-setstatus]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const c = state.companies.find(x=>x.id===currentDiagId);
      const novoStatus = el.getAttribute('data-setstatus');
      c.status = novoStatus;
      render();
      toast('Status atualizado para "'+novoStatus+'".');
      try{ await persistCompanyField(c.id, {status: novoStatus}); }
      catch(e){ toast('Não foi possível salvar o status agora.'); }
    });
  });
  const copyBtn = document.getElementById('copyMsg');
  if(copyBtn) copyBtn.addEventListener('click', async ()=>{
    const c = state.companies.find(x=>x.id===currentDiagId);
    const txt = document.getElementById('msgBox').innerText;
    try{ navigator.clipboard.writeText(txt); }catch(e){}
    flashButton(copyBtn, 'Copiado');
    toast('Mensagem copiada para a área de transferência.');
    try{ await persistCompanyField(c.id, {mensagem_gerada:txt, mensagem_tom: state.diagTone}); }catch(e){}
  });
  const regen = document.getElementById('regenMsg');
  if(regen) regen.addEventListener('click', ()=>{
    const tones=['direto','consultivo','informal'];
    const next = tones[(tones.indexOf(state.diagTone)+1)%tones.length];
    setState({diagTone: next});
  });
  const use = document.getElementById('useMsg');
  if(use) use.addEventListener('click', async ()=>{
    const c = state.companies.find(x=>x.id===currentDiagId);
    c.mensagemUtilizada = true;
    flashButton(use, 'Utilizada');
    toast('Mensagem marcada como utilizada.');
    try{ await persistCompanyField(c.id, {mensagem_utilizada:true, mensagem_tom: state.diagTone}); }catch(e){}
  });
  const monitor = document.getElementById('monitorBtn');
  if(monitor) monitor.addEventListener('click', async ()=>{
    const c = state.companies.find(x=>x.id===currentDiagId);
    c.monitorada = true;
    flashButton(monitor, 'Monitorando');
    toast('Empresa adicionada ao monitoramento.');
    try{ await persistCompanyField(c.id, {monitorada:true}); }catch(e){}
  });
  const prep = document.getElementById('prepBtn');
  if(prep) prep.addEventListener('click', ()=>{ flashButton(prep, 'Preparada'); toast('Abordagem preparada e pronta para envio.'); });
}

    ids.forEach(id=>{ const c=state.companies.find(x=>x.id===id); if(c) c.status='Priorizada'; });
    toast('Status atualizado em massa.'); state.selectedOpps=[]; render();
    try{ await sb.from('empresas').update({status:'Priorizada'}).in('id', ids); }catch(e){}
  });
}
function bindResultados(){
  document.querySelectorAll('[data-result]').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const c = state.companies.find(x=>x.id===sel.getAttribute('data-result'));
      const map = {'Sem contato':'Nova','Sem resposta':'Contatada','Respondeu':'Respondeu','Sem interesse':'Descartada','Reunião':'Reunião agendada','Proposta':'Reunião agendada','Venda':'Cliente'};
      c.status = map[sel.value] || c.status;
      c.resultado = sel.value==='Venda' ? 'venda' : null;
      toast('Resultado registrado para '+c.nome+'.');
      try{ await persistCompanyField(c.id, {status:c.status, resultado:c.resultado}); }catch(e){ toast('Não foi possível salvar agora.'); }
    });
  });
}
function bindConfiguracoes(){
  document.querySelectorAll('[data-configtab]').forEach(el=>{
    el.addEventListener('click', ()=>{ setState({configTab: el.getAttribute('data-configtab')}); });
  });
  document.querySelectorAll('[data-cpeso]').forEach(sl=>{
    sl.addEventListener('input', ()=>{
      const k = sl.getAttribute('data-cpeso');
      state.onboarding.pesos[k] = +sl.value;
      document.getElementById('cv_'+k).textContent = sl.value+'%';
    });
  });
  const save = document.getElementById('saveConfig');
  if(save) save.addEventListener('click', async ()=>{
    document.querySelectorAll('[data-cfg]').forEach(el=>{
      setPath(state, el.getAttribute('data-cfg'), el.value);
    });
    try{
      await persistSettingsPartial();
      if(state.userId){
        await sb.from('profiles').update({nome:state.user.nome, email:state.user.email, cargo:state.user.cargo}).eq('id', state.userId);
      }
    }catch(e){ toast('Não foi possível salvar agora.'); }
    render();
    flashButton(document.getElementById('saveConfig'), 'Salvo');
    toast('Configurações salvas com sucesso.');
  });
}

/* ================= INIT ================= */
// style active state for configtab nav items (since CSS uses .active class via JS attr)
document.addEventListener('click', (e)=>{
  const t = e.target.closest('[data-configtab]');
  if(t){
    document.querySelectorAll('[data-configtab]').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
  }
});

if(location.hash && !passwordRecoveryPending) state.route = location.hash;
bootAuth();
// fix initial active class for configuracoes on first paint
setTimeout(()=>{
  document.querySelectorAll('[data-configtab]').forEach(x=>{
    if(x.getAttribute('data-active')==='true') x.classList.add('active');
  });
},0);
</script>
</body>
