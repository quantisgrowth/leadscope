function opportunityDataset(){
  const f=companyListFilters();
  let list=companyListBase().slice();
  if(f.archive==='ativas') list=list.filter(c=>!c.archivedAt);
  else if(f.archive==='arquivadas') list=list.filter(c=>!!c.archivedAt);
  if(f.folderId==='sem_pasta') list=list.filter(c=>!(c.folderIds||[]).length);
  else if(f.folderId!=='todos') list=list.filter(c=>(c.folderIds||[]).includes(f.folderId));
  const query=normalizedText(f.search);
  if(query) list=list.filter(c=>normalizedText([c.nome,c.segmento,companyLocation(c),c.servicoRecomendado].join(' ')).includes(query));
  if(f.potencial!=='todos') list=list.filter(c=>c.potencial===f.potencial);
  if(f.status!=='todos') list=list.filter(c=>c.status===f.status);
  if(f.segmento!=='todos') list=list.filter(c=>c.segmento===f.segmento);
  if(f.cidade!=='todos') list=list.filter(c=>(c.cidade||companyLocation(c))===f.cidade);
  if(f.offerId!=='todos') list=list.filter(c=>{ const offer=companyOffer(c); return offer&&offer.id===f.offerId; });
  if(f.offerType!=='todos') list=list.filter(c=>{ const offer=companyOffer(c); return offer&&offer.tipo===f.offerType; });
  if(f.scoreMin!=='') list=list.filter(c=>Number(c.score)>=Number(f.scoreMin));
  if(f.scoreMax!=='') list=list.filter(c=>Number(c.score)<=Number(f.scoreMax));
  if(f.createdFrom) list=list.filter(c=>dateKey(c.createdAt)>=f.createdFrom);
  if(f.createdTo) list=list.filter(c=>dateKey(c.createdAt)<=f.createdTo);
  if(f.analyzedFrom) list=list.filter(c=>dateKey(c.analyzedAt)>=f.analyzedFrom);
  if(f.analyzedTo) list=list.filter(c=>dateKey(c.analyzedAt)<=f.analyzedTo);
  const sorters={
    score_desc:(a,b)=>Number(b.score)-Number(a.score), score_asc:(a,b)=>Number(a.score)-Number(b.score),
    created_desc:(a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')),
    analyzed_desc:(a,b)=>String(b.analyzedAt||'').localeCompare(String(a.analyzedAt||'')),
    name_asc:(a,b)=>String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR'),
  };
  list.sort(sorters[f.sort]||sorters.score_desc);
  return list;
}
function opportunityFilterChips(f){
  const offer=state.offers.find(item=>item.id===f.offerId);
  const typeLabel=OFFER_TYPES[f.offerType];
  const values=[
    ['search',f.search&&`Busca: ${f.search}`], ['createdFrom',f.createdFrom&&`Criada desde ${f.createdFrom.split('-').reverse().join('/')}`],
    ['createdTo',f.createdTo&&`Criada até ${f.createdTo.split('-').reverse().join('/')}`], ['analyzedFrom',f.analyzedFrom&&`Analisada desde ${f.analyzedFrom.split('-').reverse().join('/')}`],
    ['analyzedTo',f.analyzedTo&&`Analisada até ${f.analyzedTo.split('-').reverse().join('/')}`], ['scoreMin',f.scoreMin!==''&&`Score mínimo ${f.scoreMin}`],
    ['scoreMax',f.scoreMax!==''&&`Score máximo ${f.scoreMax}`], ['potencial',f.potencial!=='todos'&&`Potencial: ${f.potencial}`],
    ['offerId',offer&&`Produto: ${offer.nome}`], ['offerType',typeLabel&&`Tipo: ${typeLabel}`], ['status',f.status!=='todos'&&`Status: ${f.status}`],
    ['segmento',f.segmento!=='todos'&&`Segmento: ${f.segmento}`], ['cidade',f.cidade!=='todos'&&`Local: ${f.cidade}`],
    ['folderId',f.folderId==='sem_pasta'&&f.archive!=='ativas'?'Sem pasta':''], ['archive',f.archive==='todas'?'Ativas e arquivadas':''],
  ];
  return values.filter(item=>item[1]);
}

}

}

function kv(label,val){ return `<div class="row between" style="gap:12px;padding:9px 0;border-top:1px solid var(--border);font-size:13.5px;"><span class="muted" style="min-width:0;">${label}</span><span style="min-width:0;max-width:70%;overflow-wrap:anywhere;font-weight:600;text-align:right;">${val}</span></div>`; }
function verificationBadge(v){

async function edgeFunctionErrorMessage(error){
  let message=(error&&error.message)||'Falha inesperada.';
  if(error&&error.context&&typeof error.context.json==='function'){
    try{ const details=await error.context.json(); message=details.error||details.message||message; }catch(ignore){}
  }
  return message;
}

async function reanalyzeOpportunities(companyIds,button){
  const ids=Array.isArray(companyIds)?[...new Set(companyIds.filter(Boolean))]:[];
  if(button){ button.disabled=true; button.dataset.originalText=button.textContent; button.textContent='Reanalisando…'; }
  try{
    const {data,error}=await sb.functions.invoke('reanalyze-opportunities',{body:ids.length?{company_ids:ids}:{}});
    if(error) throw new Error(await edgeFunctionErrorMessage(error));
    if(data&&data.error) throw new Error(data.error);
    await loadAllData(state.userId);
    const updated=Number(data&&data.updated)||0;
    const failed=Array.isArray(data&&data.failed)?data.failed.length:0;
    const suffix=failed?` ${failed} não puderam ser atualizadas.`:' Nenhuma nova consulta externa foi realizada.';
    toast(`${updated} oportunidade${updated===1?'':'s'} reanalisada${updated===1?'':'s'}.${suffix}`);

  }catch(error){
    toast('Não foi possível reanalisar: '+((error&&error.message)||'tente novamente.'));
    return null;
  }finally{
    if(button&&document.body.contains(button)){ button.disabled=false; button.textContent=button.dataset.originalText||'Reanalisar'; }
  }
}
async function validateCompanyCnpj(){
  const company=state.companies.find(item=>item.id===currentDiagId);
  const input=document.getElementById('companyCnpjInput');
  const button=document.getElementById('validateCnpjBtn');
  if(!company||!input||!button) return;
  const cnpj=input.value.toUpperCase().replace(/[^0-9A-Z]/g,'');
  if(cnpj.length!==14){ toast('Informe um CNPJ com 14 caracteres.'); input.focus(); return; }
  button.disabled=true; button.textContent='Consultando cadastro…';
  try{
    let {data,error}=await sb.functions.invoke('validate-cnpj',{body:{company_id:company.id,cnpj}});
    if(error) throw new Error(await edgeFunctionErrorMessage(error));
    if(data&&data.error) throw new Error(data.error);
    if(data&&data.requires_confirmation){
      if(!confirm(`A correspondência com esta empresa é baixa (${data.identity_score}%).\n\nCadastro encontrado: ${data.legal_name||data.trade_name||'Nome não informado'}\nCidade: ${data.municipality||'Não informada'}\nSituação: ${data.status}\n\nConfirma que este CNPJ pertence à empresa ${company.nome}?`)) return;
      ({data,error}=await sb.functions.invoke('validate-cnpj',{body:{company_id:company.id,cnpj,confirm_identity:true}}));
      if(error) throw new Error(await edgeFunctionErrorMessage(error));
      if(data&&data.error) throw new Error(data.error);
    }
    await loadAllData(state.userId);
    toast(data&&data.active?'CNPJ validado e situação ativa confirmada.':'CNPJ consultado. Revise a situação cadastral encontrada.');
  }catch(error){
    button.disabled=false; button.textContent=company.cnpjValidatedAt?'Validar novamente':'Validar CNPJ';
    toast('Não foi possível validar o CNPJ: '+((error&&error.message)||'tente novamente.'));
  }finally{
    if(document.body.contains(button)){ button.disabled=false; button.textContent=company.cnpjValidatedAt?'Validar novamente':'Validar CNPJ'; }
  }
}
async function runSiteAudit(){
  const company=state.companies.find(item=>item.id===currentDiagId);
  const button=document.getElementById('auditSiteBtn');
  if(!company||!company.site||!button) return;
  const force=!!(company.siteAudit&&company.siteAudit.status==='concluido');
  const existingProcessing=company.siteAudit&&['pendente','processando'].includes(company.siteAudit.status)?company.siteAudit:null;
  button.disabled=true;
  button.textContent=existingProcessing?'Consultando auditoria…':'Iniciando auditoria…';
  try{
    let startData;
    if(existingProcessing){
      startData={status:'processando',audit_id:existingProcessing.id};
    }else{
      const startResponse=await sb.functions.invoke('audit-site',{body:{action:'start',company_id:company.id,force}});
      if(startResponse.error) throw new Error(await edgeFunctionErrorMessage(startResponse.error));
      startData=startResponse.data;
    }
    if(startData&&startData.error) throw new Error(startData.error);
    if(startData&&startData.status==='concluido'){
      await loadAllData(state.userId);
      toast(startData.cached?'Auditoria recente carregada.':'Auditoria do site concluída.');
      return;
    }
    if(!startData||!startData.audit_id) throw new Error('A auditoria não retornou uma identificação para acompanhamento.');
    button.textContent='Auditando site…';
    const deadline=Date.now()+210000;
    let result=startData;
    while(result.status!=='concluido'){
      if(Date.now()>deadline) throw new Error('A auditoria continua processando. Tente abrir esta empresa novamente em alguns instantes.');
      await new Promise(resolve=>setTimeout(resolve,3000));
      const {data:statusData,error:statusError}=await sb.functions.invoke('audit-site',{body:{action:'status',audit_id:startData.audit_id}});
      if(statusError) throw new Error(await edgeFunctionErrorMessage(statusError));
      if(statusData&&statusData.error) throw new Error(statusData.error);
      result=statusData||{};
    }
    await loadAllData(state.userId);
    toast('Auditoria técnica concluída e salva.');
  }catch(error){
    button.disabled=false;
    button.textContent=force?'Auditar novamente':'Auditar site';
    toast('Não foi possível auditar o site: '+((error&&error.message)||'tente novamente.'));
  }
}

function renderResultados(){
  const cs = state.companies;
  const analisadas = cs.length;
  const abordadas = cs.filter(c=>c.status!=='Nova').length;
  const respostas = cs.filter(c=>['Respondeu','Reunião agendada','Cliente'].includes(c.status)).length;
  const reunioes = cs.filter(c=>['Reunião agendada','Cliente'].includes(c.status)).length;
  const propostas = cs.filter(c=>c.status==='Cliente').length;
  const vendas = cs.filter(c=>c.resultado==='venda').length;
  const receita = vendas*1500 + Math.floor(Math.random()*0);
  const chart = [{label:'Site',v:22},{label:'S/ resposta',v:18},{label:'S/ agenda',v:31},{label:'Perfil incomp.',v:12}];

  return `
  <h1 class="page-title">Resultados</h1>
  <p class="page-sub">Relação entre diagnósticos gerados e resultados comerciais obtidos.</p>
  <div class="kpi-grid" style="margin-bottom:20px;">
    ${[['Oportunidades analisadas',analisadas],['Abordagens realizadas',abordadas],['Respostas',respostas],['Reuniões',reunioes],['Propostas / Clientes',propostas],['Vendas',vendas],['Receita gerada (estimada)','R$ '+receita.toLocaleString('pt-BR')]].map(([l,v])=>`
      <div class="kpi-card"><div class="kpi-label">${l}</div><div class="kpi-val">${v}</div></div>`).join('')}
  </div>
  <div class="grid" style="grid-template-columns:1.2fr 1fr;align-items:start;margin-bottom:20px;">
    <div class="card">
      <div class="card-title">Sinais que mais geraram resposta e reuniões</div>
      <p class="card-sub">Percentual de resposta por tipo de sinal identificado (dados demonstrativos).</p>
      ${barChartSVG(chart)}
    </div>
    <div class="card">
      <div class="card-title">Registrar resultado por empresa</div>
      <div class="table-scroll">
      <table>
        <thead><tr><th>Empresa</th><th>Resultado</th></tr></thead>
        <tbody>
        ${cs.slice(0,8).map(c=>`
          <tr class="row-hover"><td style="max-width:150px;">${c.nome}</td>
          <td><select class="input" data-result="${c.id}">
            ${['Sem contato','Sem resposta','Respondeu','Sem interesse','Reunião','Proposta','Venda'].map(o=>`<option ${matchResult(c,o)?'selected':''}>${o}</option>`).join('')}
          </select></td></tr>`).join('')}
        </tbody>
      </table>
      </div>
    </div>
  </div>`;
}
function matchResult(c,label){
  const map = {'Nova':'Sem contato','Em análise':'Sem contato','Priorizada':'Sem contato','Abordagem preparada':'Sem contato','Contatada':'Sem resposta','Respondeu':'Respondeu','Reunião agendada':'Reunião','Cliente':'Venda','Descartada':'Sem interesse'};
  return map[c.status]===label;
}

/* ================= EVENT BINDING PER PAGE ================= */
function bindPageEvents(route){
  document.querySelectorAll('[data-diag]').forEach(el=>{
    el.addEventListener('click', ()=>{
      currentDiagId=el.getAttribute('data-diag');
      state.diagReturnRoute=state.route&&state.route.startsWith('#/diagnostico/')?'#/oportunidades':state.route;
      saveUiPrefs();
      navigate('#/diagnostico/'+currentDiagId);
    });
  });
  if(route==='radar') bindRadarProcessing();
  const detailRoute=(route==='diagnostico'||route==='empresa')&&!!(state.route||'').split('/')[2];
  if(route==='oportunidades'||route==='monitoradas'||((route==='diagnostico'||route==='empresa')&&!detailRoute)) bindOportunidades();
  if(detailRoute) bindDiagnostico();
  if(route==='relatorios') bindRelatorios();
  if(route==='resultados') bindResultados();
  if(route==='configuracoes') bindConfiguracoes();
  const topSearch = document.getElementById('topSearch');
  if(topSearch) topSearch.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){ toast('Buscando por "'+topSearch.value+'"...'); }
  });
}
function bindOportunidades(){
  const resetOpportunityFilters=()=>{
    const layout={view:companyListFilters().view,pageSize:companyListFilters().pageSize,sort:companyListFilters().sort};
    setCompanyListFilters(Object.assign({},DEFAULT_OPP_FILTERS,layout));
    state.selectedOpps=[];
  };
  const picker=document.getElementById('oppFolderPicker'),folderSearch=document.getElementById('folderMenuSearch');
  if(picker) picker.addEventListener('toggle',()=>{if(picker.open)folderSearch?.focus();});
  if(folderSearch)folderSearch.addEventListener('input',()=>{
    const query=folderSearchKey(folderSearch.value);let matches=0;
    document.querySelectorAll('[data-folder-search]').forEach(row=>{row.hidden=!row.dataset.folderSearch.includes(query);if(!row.hidden)matches++;});
    document.getElementById('folderSearchEmpty').hidden=matches>0;
  });
  document.querySelectorAll('[data-favorite-folder]').forEach(button=>button.addEventListener('click',()=>{
    const id=button.dataset.favoriteFolder,favorites=folderFavorites(),exists=favorites.includes(id);
    if(!exists&&favorites.length>=3){toast('Você pode favoritar até 3 pastas. Remova uma favorita primeiro.');return;}
    try{localStorage.setItem('leadscope_folder_favorites_'+(state.authUserId||state.userId),JSON.stringify(exists?favorites.filter(value=>value!==id):[...favorites,id]));}catch{toast('Não foi possível salvar suas favoritas neste navegador.');return;}
    const query=folderSearch.value;render();
    document.getElementById('oppFolderPicker').open=true;
    const input=document.getElementById('folderMenuSearch');input.value=query;input.dispatchEvent(new Event('input'));
  }));
  const manager=document.getElementById('oppFolderManager');
  document.getElementById('manageOppFolders')?.addEventListener('click',()=>{picker.open=false;manager.showModal();});
  document.getElementById('closeFolderManager')?.addEventListener('click',()=>manager.close());
  manager?.addEventListener('click',event=>{if(event.target===manager){const bounds=manager.getBoundingClientRect();if(event.clientX<bounds.left||event.clientX>bounds.right||event.clientY<bounds.top||event.clientY>bounds.bottom)manager.close();}});
  document.getElementById('viewAllOpportunities')?.addEventListener('click',()=>{resetOpportunityFilters();setState({});});
  const vt = document.getElementById('viewTabela'), vc = document.getElementById('viewCards'), vf=document.getElementById('viewFunnel');
  if(vt) vt.addEventListener('click', ()=>{ companyListFilters().view='tabela'; setState({}); });
  if(vc) vc.addEventListener('click', ()=>{ companyListFilters().view='cards'; setState({}); });
  if(vf) vf.addEventListener('click', ()=>{ companyListFilters().view='funil'; companyListFilters().page=1; setState({}); });
  const filterBindings={
    fCreatedFrom:'createdFrom',fCreatedTo:'createdTo',fAnalyzedFrom:'analyzedFrom',fAnalyzedTo:'analyzedTo',
    fScoreMin:'scoreMin',fScoreMax:'scoreMax',fPotencial:'potencial',fStatus:'status',fOffer:'offerId',
    fOfferType:'offerType',fSegmento:'segmento',fCidade:'cidade',fFolder:'folderId',fArchive:'archive',fSort:'sort',fPageSize:'pageSize',
  };
  document.querySelectorAll('[data-folder-view]').forEach(button=>button.addEventListener('click',()=>{
    companyListFilters().folderId=button.getAttribute('data-folder-view')||'todos';
    companyListFilters().archive=button.getAttribute('data-archive-view')||'ativas';
    companyListFilters().page=1; state.selectedOpps=[]; setState({});
  }));
  document.querySelectorAll('[data-funnel-status]').forEach(select=>select.addEventListener('change',async()=>{
    const company=state.companies.find(item=>item.id===select.getAttribute('data-funnel-status'));
    const previous=company&&company.status;
    try{ await updateCompanyStatus(company,select.value); render(); toast(`Oportunidade movida de "${previous}" para "${select.value}".`); }
    catch(error){ select.value=previous||'Nova'; toast('Não foi possível mover a oportunidade agora.'); }
  }));
  const newFolder=document.getElementById('newOppFolder');
  if(newFolder) newFolder.addEventListener('click',async()=>{
    if(state.readOnly)return;
    const name=(window.prompt('Nome da nova pasta:')||'').trim();
    if(!name) return;
    const {data,error}=await sb.from('opportunity_folders').insert({user_id:state.userId,nome:name}).select('*').single();
    if(error){ toast(error.code==='23505'?'Já existe uma pasta com esse nome.':'Não foi possível criar a pasta.'); return; }
    state.folders.unshift({id:data.id,nome:data.nome,cor:data.cor||'#10a37f'});
    companyListFilters().folderId=data.id; companyListFilters().archive='ativas'; companyListFilters().page=1; setState({});
  });
  const activeFolder=state.folders.find(folder=>folder.id===companyListFilters().folderId);
  document.querySelectorAll('[data-rename-folder]').forEach(renameFolder=>renameFolder.addEventListener('click',async()=>{
    const activeFolder=state.folders.find(folder=>folder.id===renameFolder.dataset.renameFolder);
    if(state.readOnly||!activeFolder)return;
    const name=(window.prompt('Novo nome da pasta:',activeFolder.nome)||'').trim();
    if(!name||name===activeFolder.nome) return;
    const {error}=await sb.from('opportunity_folders').update({nome:name,updated_at:new Date().toISOString()}).eq('id',activeFolder.id).eq('user_id',state.userId);
    if(error){ toast(error.code==='23505'?'Já existe uma pasta com esse nome.':'Não foi possível renomear a pasta.'); return; }
    activeFolder.nome=name; setState({}); toast('Pasta renomeada.');
  }));
  document.querySelectorAll('[data-delete-folder]').forEach(deleteFolder=>deleteFolder.addEventListener('click',async()=>{
    const activeFolder=state.folders.find(folder=>folder.id===deleteFolder.dataset.deleteFolder);
    if(state.readOnly||!activeFolder)return;
    if(!window.confirm(`Excluir a pasta “${activeFolder.nome}”? As empresas não serão excluídas.`)) return;
    const {error}=await sb.from('opportunity_folders').delete().eq('id',activeFolder.id).eq('user_id',state.userId);
    if(error){ toast('Não foi possível excluir a pasta.'); return; }
    state.folders=state.folders.filter(folder=>folder.id!==activeFolder.id);
    state.companies.forEach(company=>{ company.folderIds=(company.folderIds||[]).filter(id=>id!==activeFolder.id); });
    if(companyListFilters().folderId===activeFolder.id)companyListFilters().folderId='todos'; companyListFilters().page=1; setState({}); toast('Pasta excluída; as empresas foram preservadas.');
  }));
  const sort=document.getElementById('fSort');
  if(sort) sort.addEventListener('change',()=>{ companyListFilters().sort=sort.value; companyListFilters().page=1; setState({}); });
  const search=document.getElementById('fSearch');
  if(search) search.addEventListener('keydown',event=>{
    if(event.key==='Enter'){ companyListFilters().search=search.value.trim(); companyListFilters().page=1; setState({}); }
  });
  if(search) search.addEventListener('change',()=>{ companyListFilters().search=search.value.trim(); companyListFilters().page=1; setState({}); });
  const openFilters=document.getElementById('openOppFilters');
  if(openFilters) openFilters.addEventListener('click',()=>setState({oppFilterOpen:true}));
  ['closeOppFilters','closeOppFiltersButton'].forEach(id=>{
    const close=document.getElementById(id); if(close) close.addEventListener('click',()=>setState({oppFilterOpen:false}));
  });
  const applyFilters=document.getElementById('applyOppFilters');
  if(applyFilters) applyFilters.addEventListener('click',()=>{
    Object.entries(filterBindings).forEach(([id,key])=>{
      if(key==='sort') return;
      const input=document.getElementById(id); if(input) companyListFilters()[key]=input.value;
    });
    companyListFilters().page=1; state.oppFilterOpen=false; setState({});
  });
  const clear=document.getElementById('clearOppFilters');
  if(clear) clear.addEventListener('click',()=>{ resetOpportunityFilters(); setState({}); });
  const clearDrawer=document.getElementById('clearOppFiltersDrawer');
  if(clearDrawer) clearDrawer.addEventListener('click',()=>{ resetOpportunityFilters(); state.oppFilterOpen=false; setState({}); });
  document.querySelectorAll('[data-clear-filter]').forEach(button=>button.addEventListener('click',()=>{
    const key=button.getAttribute('data-clear-filter');
    companyListFilters()[key]=DEFAULT_OPP_FILTERS[key]; companyListFilters().page=1; setState({});
  }));
  document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>{
    if(button.disabled) return; companyListFilters().page=Number(button.getAttribute('data-page'))||1; setState({});
  }));
  document.querySelectorAll('.selOpp').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const id = cb.getAttribute('data-id');
      if(cb.checked) state.selectedOpps.push(id); else state.selectedOpps = state.selectedOpps.filter(x=>x!==id);
      render();
    });
  });
  const selAll=document.getElementById('selAll');
  if(selAll){
    const visibleIds=[...document.querySelectorAll('.selOpp')].map(cb=>cb.getAttribute('data-id'));
    const selectedCount=visibleIds.filter(id=>state.selectedOpps.includes(id)).length;
    selAll.checked=visibleIds.length>0&&selectedCount===visibleIds.length;
    selAll.indeterminate=selectedCount>0&&selectedCount<visibleIds.length;
    selAll.addEventListener('change',()=>{
      if(selAll.checked) state.selectedOpps=[...new Set([...state.selectedOpps,...visibleIds])];
      else state.selectedOpps=state.selectedOpps.filter(id=>!visibleIds.includes(id));
      setState({});
    });
  }
  document.querySelectorAll('[data-export-csv]').forEach(button=>button.addEventListener('click',()=>downloadCompanyCsv(button.dataset.exportCsv)));
  const bm = document.getElementById('bulkMonitor');
  if(bm) bm.addEventListener('click', async ()=>{
    const ids = state.selectedOpps.slice();
    const {error}=await sb.from('empresas').update({monitorada:true}).eq('user_id',state.userId).in('id', ids);
    if(error){ toast('Não foi possível atualizar o monitoramento.'); return; }
    ids.forEach(id=>{ const c=state.companies.find(x=>x.id===id); if(c) c.monitorada=true; });
    toast(ids.length+' empresas marcadas para monitoramento.'); state.selectedOpps=[]; render();
  });
  const bulkReanalyze=document.getElementById('bulkReanalyze');
  if(bulkReanalyze) bulkReanalyze.addEventListener('click',async()=>{
    const ids=state.selectedOpps.slice();
    const result=await reanalyzeOpportunities(ids,bulkReanalyze);
    if(result){ state.selectedOpps=[]; render(); }
  });
  const bs = document.getElementById('bulkStatus');
  if(bs) bs.addEventListener('click', async ()=>{
    const ids = state.selectedOpps.slice();
    const {error}=await sb.from('empresas').update({status:'Priorizada'}).eq('user_id',state.userId).in('id', ids);
    if(error){ toast('Não foi possível atualizar o status.'); return; }
    ids.forEach(id=>{ const c=state.companies.find(x=>x.id===id); if(c&&c.status!=='Priorizada'){ const previous=c.status; c.status='Priorizada'; c.statusHistory=c.statusHistory||[]; c.statusHistory.unshift({from:previous,to:'Priorizada',at:new Date().toISOString(),by:state.userId}); } });
    toast('Status atualizado em massa.'); state.selectedOpps=[]; render();
  });
  const addFolder=document.getElementById('bulkAddFolder');
  if(addFolder) addFolder.addEventListener('click',async()=>{
    const folderId=(document.getElementById('bulkFolder')||{}).value;
    const ids=state.selectedOpps.slice();
    if(!folderId){ toast('Escolha uma pasta primeiro.'); return; }
    const rows=ids.map(empresaId=>({user_id:state.userId,folder_id:folderId,empresa_id:empresaId}));
    const {error}=await sb.from('opportunity_folder_companies').upsert(rows,{onConflict:'folder_id,empresa_id',ignoreDuplicates:true});
    if(error){ toast('Não foi possível adicionar as empresas à pasta.'); return; }
    ids.forEach(id=>{ const company=state.companies.find(item=>item.id===id); if(company) company.folderIds=[...new Set([...(company.folderIds||[]),folderId])]; });
    state.selectedOpps=[]; render(); toast(ids.length+' empresa'+(ids.length===1?' adicionada':'s adicionadas')+' à pasta.');
  });
  const removeFolder=document.getElementById('bulkRemoveFolder');
  if(removeFolder&&activeFolder) removeFolder.addEventListener('click',async()=>{
    const ids=state.selectedOpps.slice();
    const {error}=await sb.from('opportunity_folder_companies').delete().eq('user_id',state.userId).eq('folder_id',activeFolder.id).in('empresa_id',ids);
    if(error){ toast('Não foi possível remover as empresas da pasta.'); return; }
    ids.forEach(id=>{ const company=state.companies.find(item=>item.id===id); if(company) company.folderIds=(company.folderIds||[]).filter(folderId=>folderId!==activeFolder.id); });
    state.selectedOpps=[]; render(); toast('Empresas removidas da pasta.');
  });
  const archive=document.getElementById('bulkArchive');
  if(archive) archive.addEventListener('click',async()=>{
    const ids=state.selectedOpps.slice();
    const restoring=companyListFilters().archive==='arquivadas';
    const archivedAt=restoring?null:new Date().toISOString();
    const {error}=await sb.from('empresas').update({archived_at:archivedAt}).eq('user_id',state.userId).in('id',ids);
    if(error){ toast('Não foi possível '+(restoring?'desarquivar':'arquivar')+' as empresas.'); return; }
    ids.forEach(id=>{ const company=state.companies.find(item=>item.id===id); if(company) company.archivedAt=archivedAt; });
    state.selectedOpps=[]; render(); toast(ids.length+' empresa'+(ids.length===1?'':'s')+' '+(restoring?'restaurada'+(ids.length===1?'':'s'):'arquivada'+(ids.length===1?'':'s'))+'.');
  });
}
function bindResultados(){
  document.querySelectorAll('[data-result]').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const c = state.companies.find(x=>x.id===sel.getAttribute('data-result'));
      const map = {'Sem contato':'Nova','Sem resposta':'Contatada','Respondeu':'Respondeu','Sem interesse':'Descartada','Reunião':'Reunião agendada','Proposta':'Reunião agendada','Venda':'Cliente'};
      const nextStatus=map[sel.value]||c.status;
      const result=sel.value==='Venda'?'venda':null;
      try{
        if(nextStatus!==c.status) await updateCompanyStatus(c,nextStatus);
        await persistCompanyField(c.id,{resultado:result});
        c.resultado=result; toast('Resultado registrado para '+c.nome+'.');
      }catch(e){ toast('Não foi possível salvar agora.'); }
    });
  });
}
function bindConfiguracoes(){
  const inviteButtons=['createTeamInviteLink','sendTeamInvite'].map(id=>document.getElementById(id)).filter(Boolean);
  inviteButtons.forEach(invite=>invite.onclick=async()=>{
    inviteButtons.forEach(button=>button.disabled=true);
    try{ const result=await teamRequest({action:'invite',delivery:invite.id==='createTeamInviteLink'?'link':'email',email:document.getElementById('inviteEmail').value,role:document.getElementById('inviteRole').value});if(result.link) showTeamInviteLink(result);else toast(result.message);await refreshTeamInvites(); }
    catch(error){toast(error.message);}finally{inviteButtons.forEach(button=>{if(document.body.contains(button)) button.disabled=false;});}
  });
  const refresh=document.getElementById('refreshTeamInvites');
  if(refresh) refresh.onclick=refreshTeamInvites;
  document.querySelectorAll('[data-configtab]').forEach(el=>{
    el.addEventListener('click', ()=>{ setState({configTab: el.getAttribute('data-configtab')}); });
  });
  document.querySelectorAll('[data-theme-choice]').forEach(button=>{
    button.addEventListener('click',()=>{
      state.theme=button.getAttribute('data-theme-choice')==='light'?'light':'dark';
      setState({}); toast('Tema '+(state.theme==='light'?'claro':'escuro')+' aplicado.');
    });
  });
  document.querySelectorAll('[data-cpeso]').forEach(sl=>{
    sl.addEventListener('input', ()=>{
      const k = sl.getAttribute('data-cpeso');
      state.onboarding.pesos[k] = +sl.value;
      document.getElementById('cv_'+k).textContent = sl.value+'%';
    });
  });
  const newOffer=document.getElementById('newOffer');
  if(newOffer) newOffer.addEventListener('click',()=>setState({offerEditor:{
    nome:'',resultado:'',descricao:'',ticketMin:null,ticketMax:null,ativo:true,tipo:'servico',
    etapa:'entrada',modeloCobranca:'unico',publicoAlvo:'',categorias:[],sinais:[],prioridade:50,posicao:state.offers.length,
  }}));
  const reanalyzeAllOffers=document.getElementById('reanalyzeAllOffers');
  if(reanalyzeAllOffers) reanalyzeAllOffers.addEventListener('click',()=>reanalyzeOpportunities([],reanalyzeAllOffers));
  const cancelOffer=document.getElementById('cancelOffer');
  if(cancelOffer) cancelOffer.addEventListener('click',()=>setState({offerEditor:null}));
  document.querySelectorAll('[data-offer-edit]').forEach(button=>button.addEventListener('click',()=>{
    const offer=state.offers.find(item=>item.id===button.getAttribute('data-offer-edit'));
    if(offer) setState({offerEditor:Object.assign({},offer,{categorias:offer.categorias.slice(),sinais:offer.sinais.slice()})});
  }));
  document.querySelectorAll('[data-offer-toggle]').forEach(button=>button.addEventListener('click',async()=>{
    const offer=state.offers.find(item=>item.id===button.getAttribute('data-offer-toggle'));
    if(!offer) return;
    button.disabled=true;
    const {error}=await sb.from('offers').update({ativo:!offer.ativo,updated_at:new Date().toISOString()}).eq('id',offer.id);
    if(error){ button.disabled=false; toast('Não foi possível atualizar o produto.'); return; }
    offer.ativo=!offer.ativo; radarOfferIds=null; render(); toast(`Produto ${offer.ativo?'ativado':'desativado'}.`);
  }));
  const saveOffer=document.getElementById('saveOffer');
  if(saveOffer) saveOffer.addEventListener('click',async()=>{
    const value=id=>document.getElementById(id).value.trim();
    const nome=value('offerName');
    const ticketMin=value('offerTicketMin'), ticketMax=value('offerTicketMax');
    if(!nome){ toast('Informe o nome do produto.'); return; }
    if(ticketMin!==''&&ticketMax!==''&&Number(ticketMax)<Number(ticketMin)){ toast('O ticket máximo deve ser maior ou igual ao mínimo.'); return; }
    const payload={
      user_id:state.userId,nome,etapa:value('offerStage'),tipo:value('offerType'),modelo_cobranca:value('offerBilling'),
      prioridade:Math.max(0,Math.min(100,Number(value('offerPriority'))||50)),
      ticket_min:ticketMin===''?null:Number(ticketMin),ticket_max:ticketMax===''?null:Number(ticketMax),
      resultado:value('offerResult')||null,descricao:value('offerDescription')||null,publico_alvo:value('offerAudience')||null,
      categorias:value('offerCategories').split(',').map(item=>item.trim()).filter(Boolean).slice(0,20),
      sinais:Array.from(document.querySelectorAll('[data-offer-signal]:checked')).map(input=>input.value),
      ativo:state.offerEditor.ativo!==false,posicao:Number(state.offerEditor.posicao)||0,updated_at:new Date().toISOString(),
    };
    saveOffer.disabled=true;
    const request=state.offerEditor.id?sb.from('offers').update(payload).eq('id',state.offerEditor.id):sb.from('offers').insert(payload);
    const {error}=await request;
    if(error){ saveOffer.disabled=false; toast('Não foi possível salvar o produto: '+error.message); return; }
    state.offerEditor=null; radarOfferIds=null; await loadAllData(state.userId); toast('Produto salvo e incluído na esteira.');
  });
  const save = document.getElementById('saveConfig');
  if(save) save.addEventListener('click', async ()=>{
    document.querySelectorAll('[data-cfg]').forEach(el=>{
      setPath(state, el.getAttribute('data-cfg'), el.value);
    });
    try{
      if(state.configTab!=='perfil') await persistSettingsPartial();
      if(state.userId){
        const {error}=await sb.from('profiles').update({nome:state.user.nome, email:state.user.email, cargo:state.user.cargo}).eq('id', state.authUserId||state.userId);
        if(error) throw error;
      }
    }catch(e){ toast('Não foi possível salvar agora.'); return; }
    render();
    flashButton(document.getElementById('saveConfig'), 'Salvo');
    toast('Configurações salvas com sucesso.');
  });
}

/* ================= INIT ================= */
// style active state for configtab nav items (since CSS uses .active class via JS attr)
document.addEventListener('click', (e)=>{
  const t = e.target.closest('[data-configtab]');
  if(t){
    document.querySelectorAll('[data-configtab]').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
  }
});

if(location.hash && !passwordRecoveryPending) state.route = location.hash;
bootAuth();
// fix initial active class for configuracoes on first paint
setTimeout(()=>{
  document.querySelectorAll('[data-configtab]').forEach(x=>{
    if(x.getAttribute('data-active')==='true') x.classList.add('active');
  });
},0);
</script>
