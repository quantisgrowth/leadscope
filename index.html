<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LeadScope — Inteligência comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#212121;--surface:#171717;--card:#2f2f2f;--input:#2f2f2f;
  --blue:#10a37f;--blue-light:#19c39a;--text:#ececec;--text-secondary:#b4b4b4;
  --border:#424242;--hover:#383838;--topbar-bg:rgba(33,33,33,.88);
  --warn:#f0a848;--error:#ef6b6b;--radius:14px;--gray-badge:#3b3b3b;
  --shadow:0 18px 46px rgba(0,0,0,.28);--scrim:rgba(0,0,0,.58);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing:border-box;
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#ffffff;--surface:#f9f9f9;--card:#ffffff;--input:#ffffff;
  --blue:#10a37f;--blue-light:#087f65;--text:#0d0d0d;--text-secondary:#676767;
  --border:#e5e5e5;--hover:#f4f4f4;--topbar-bg:rgba(255,255,255,.9);
  --warn:#b86600;--error:#d23b3b;--gray-badge:#f1f1f1;
  --shadow:0 18px 46px rgba(0,0,0,.12);--scrim:rgba(0,0,0,.28);
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
html,body{height:100%;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:'Inter',ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.font-head{font-family:inherit;letter-spacing:-.025em;}
a{color:inherit;}
button{font-family:inherit;}
input[type="checkbox"]{accent-color:var(--blue);}
::selection{background:color-mix(in srgb,var(--blue) 35%,transparent);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- utility ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 16px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--text);font-size:14px;font-weight:600;
  cursor:pointer;transition:background .15s,border-color .15s,transform .1s;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn:hover{border-color:var(--text-secondary);background:var(--hover);}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;}
.btn-primary:hover{filter:brightness(.94);background:var(--blue);border-color:var(--blue);}
.btn-ghost{border-color:transparent;}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:7px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.input, select.input, textarea.input{
  width:100%;background:var(--input);border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none;
}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent);}
.password-field{position:relative;}
.password-field .input{padding-right:46px;}
.password-toggle{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:transparent;color:var(--text-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:7px;}
.password-toggle:hover,.password-toggle:focus-visible{color:var(--text);background:var(--hover);outline:none;}
.text-action{font-size:12.5px;color:var(--blue-light);cursor:pointer;background:none;border:0;padding:0;font-family:inherit;}
.text-action:hover{text-decoration:underline;}
.label{font-size:12.5px;color:var(--text-secondary);font-weight:600;margin-bottom:6px;display:block;letter-spacing:.01em;}
.field{margin-bottom:14px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
.card-title{font-size:15px;font-weight:700;margin:0 0 4px;}
.card-sub{font-size:13px;color:var(--text-secondary);margin:0 0 14px;}
.muted{color:var(--text-secondary);}
.row{display:flex;align-items:center;}
.gap-8{gap:8px;} .gap-12{gap:12px;} .gap-16{gap:16px;}
.between{justify-content:space-between;}
.wrap{flex-wrap:wrap;}
.grid{display:grid;gap:16px;}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--border);color:var(--text-secondary);background:var(--gray-badge);}
.badge-blue{background:color-mix(in srgb,var(--blue) 14%,transparent);border-color:color-mix(in srgb,var(--blue) 38%,transparent);color:var(--blue-light);}
.badge-warn{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.35);color:var(--warn);}
.badge-error{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.35);color:#ff8080;}
.badge-gray{background:rgba(135,145,156,.12);}
.divider{height:1px;background:var(--border);margin:16px 0;border:none;}
.icon{width:18px;height:18px;flex:0 0 auto;display:inline-block;}
.skeleton{background:linear-gradient(90deg,#0c1c28 25%,#122535 37%,#0c1c28 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:6px;}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.tooltip{position:relative;}
.tooltip:hover .tooltip-bubble{opacity:1;transform:translateY(0) translateX(-50%);pointer-events:auto;}
.tooltip-bubble{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateY(4px) translateX(-50%);
  background:var(--card);border:1px solid var(--border);color:var(--text);font-size:12px;font-weight:500;
  padding:8px 10px;border-radius:8px;white-space:nowrap;opacity:0;transition:.15s;z-index:40;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.toast-wrap{position:fixed;top:calc(20px + env(safe-area-inset-top,0px));right:20px;z-index:300;display:flex;flex-direction:column;gap:10px;max-width:360px;width:calc(100% - 40px);pointer-events:none;}
.toast{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--blue);padding:13px 16px;border-radius:9px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow);animation:toastin .22s cubic-bezier(.2,.9,.3,1.2);display:flex;align-items:flex-start;gap:10px;pointer-events:auto;position:relative;overflow:hidden;}
.toast .toast-check{width:20px;height:20px;border-radius:50%;background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue-light);display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px;}
.toast .toast-check svg{width:12px;height:12px;}
.toast .toast-bar{position:absolute;left:0;bottom:0;height:2px;background:var(--blue);animation:toastbar 3.2s linear forwards;}
@keyframes toastin{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastbar{from{width:100%}to{width:0%}}
@media (max-width:520px){.toast-wrap{right:10px;left:10px;width:auto;max-width:none;}}
.btn-flash{background:var(--blue) !important;border-color:var(--blue) !important;color:#fff !important;}
.empty{text-align:center;padding:48px 20px;color:var(--text-secondary);}
.empty h4{color:var(--text);margin:10px 0 6px;font-size:15px;}
.empty p{margin:0 0 16px;font-size:13.5px;}
.slider{-webkit-appearance:none;width:100%;height:5px;border-radius:4px;background:var(--border);outline:none;}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--blue);cursor:pointer;border:2px solid #0a1a26;}
.slider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--blue);cursor:pointer;border:2px solid #0a1a26;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;}
.tab{padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab.active{color:var(--text);border-color:var(--blue);}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-secondary);padding:6px 0;}
.checkbox-row input{accent-color:var(--blue);width:15px;height:15px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;color:var(--text-secondary);font-weight:600;font-size:12px;text-transform:none;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr.row-hover:hover{background:var(--hover);}
.table-scroll{overflow-x:auto;}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#fff;flex:0 0 auto;}
.donut-label{font-family:inherit;font-weight:700;}
.pill-group{display:flex;gap:6px;flex-wrap:wrap;}
.pill{padding:6px 12px;border-radius:999px;border:1px solid var(--border);font-size:12.5px;cursor:pointer;color:var(--text-secondary);background:transparent;}
.pill.active{background:color-mix(in srgb,var(--blue) 14%,transparent);border-color:var(--blue);color:var(--blue-light);}
.category-picker{position:relative;min-height:42px;background:var(--input);border:1px solid var(--border);border-radius:8px;padding:6px 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.category-picker:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent);}
#rCategoryChips{display:contents;}
.category-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:color-mix(in srgb,var(--blue) 14%,transparent);border:1px solid color-mix(in srgb,var(--blue) 35%,transparent);color:var(--blue-light);font-size:12px;font-weight:600;}
.category-chip button{border:0;background:transparent;color:inherit;padding:0;cursor:pointer;font-size:16px;line-height:1;}
.category-input{flex:1;min-width:180px;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:14px;padding:4px;}
.category-suggestions{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:90;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);max-height:230px;overflow:auto;display:none;}
.category-suggestions.show{display:block;}
.category-option{padding:10px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid rgba(29,51,68,.65);}
.category-option:last-child{border-bottom:0;}
.category-option:hover,.category-option.active{background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--blue-light);}
.verification-note{border:1px solid var(--border);background:color-mix(in srgb,var(--blue) 6%,transparent);border-radius:9px;padding:11px 12px;color:var(--text-secondary);font-size:12.5px;line-height:1.5;margin-bottom:14px;}

/* ---------- app shell ---------- */
.app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:256px;background:var(--surface);border-right:1px solid var(--border);
  position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;
  padding-top:calc(20px + env(safe-area-inset-top,0px));z-index:50;transition:transform .2s ease;
}
.sidebar-logo{padding:0 22px 22px;display:flex;align-items:center;gap:10px;}
.sidebar-logo .mark{width:30px;height:30px;border-radius:9px;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.sidebar-logo b{font-size:17px;font-weight:800;letter-spacing:-.01em;}
.nav-scroll{flex:1;overflow-y:auto;padding-bottom:10px;}
.nav-section-label{padding:14px 22px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-secondary);font-weight:600;opacity:.7;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 22px;color:var(--text-secondary);
  cursor:pointer;border-left:3px solid transparent;font-size:14px;font-weight:500;
}
.nav-item:hover{color:var(--text);background:var(--hover);}
.nav-item.active{color:var(--text);background:var(--hover);border-left-color:var(--blue);font-weight:600;}
.sidebar-footer{border-top:1px solid var(--border);padding:16px 22px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));}
.sidebar-user{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.sidebar-user .meta{min-width:0;}
.sidebar-user .name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar-user .org{font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.plan-chip{font-size:11px;color:var(--blue-light);background:color-mix(in srgb,var(--blue) 12%,transparent);padding:2px 8px;border-radius:6px;display:inline-block;margin-bottom:10px;}

.main{margin-left:256px;flex:1;display:flex;flex-direction:column;min-height:100vh;min-width:0;}
.topbar{
  height:64px;min-height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;
  padding:0 24px;position:sticky;top:0;background:var(--topbar-bg);backdrop-filter:blur(12px);z-index:20;
  padding-top:env(safe-area-inset-top,0px);height:calc(64px + env(safe-area-inset-top,0px));
}
.search-box{flex:1;max-width:360px;display:flex;align-items:center;gap:8px;background:var(--input);border:1px solid var(--border);border-radius:10px;padding:8px 12px;}
.search-box input{background:transparent;border:none;outline:none;color:var(--text);font-size:13.5px;width:100%;}
.period-select{background:var(--input);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 10px;font-size:13px;}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;background:transparent;cursor:pointer;color:var(--text-secondary);position:relative;flex:0 0 auto;}
.icon-btn:hover{color:var(--text);background:var(--hover);}
.dot-notif{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--warn);}
.hamburger{display:none;}
.content{padding:26px 28px 60px;flex:1;max-width:1400px;width:100%;}
.page-title{font-size:22px;font-weight:800;margin:0 0 4px;}
.page-sub{color:var(--text-secondary);font-size:13.5px;margin:0 0 22px;}
.opp-toolbar{padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.opp-search{display:flex;align-items:center;gap:9px;min-width:260px;flex:1;max-width:520px;background:var(--input);border:1px solid var(--border);border-radius:10px;padding:8px 11px;}
.opp-search:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 15%,transparent);}
.opp-search input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:13.5px;}
.filter-chips{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:-2px 0 14px;}
.filter-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:5px 9px;font:inherit;font-size:12px;cursor:pointer;max-width:260px;}
.filter-chip:hover{background:var(--hover);}
.bulk-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;margin-bottom:14px;border:1px solid color-mix(in srgb,var(--blue) 35%,var(--border));background:color-mix(in srgb,var(--blue) 8%,var(--card));border-radius:12px;}
.folder-strip{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:2px 0 12px;margin-bottom:2px;}
.folder-picker{position:relative;min-width:0;max-width:100%;}
.export-picker{position:relative;}.export-picker summary{list-style:none;}.export-picker summary::-webkit-details-marker{display:none;}
.export-menu{position:absolute;right:0;top:calc(100% + 8px);width:310px;max-width:calc(100vw - 48px);z-index:35;padding:8px;border:1px solid var(--border);border-radius:12px;background:var(--card);box-shadow:0 12px 36px rgba(0,0,0,.18);box-sizing:border-box;}
.export-menu button{display:block;width:100%;padding:10px;text-align:left;border:0;border-radius:8px;background:transparent;color:var(--text);font:inherit;font-size:13px;cursor:pointer;}.export-menu button:hover:not(:disabled){background:var(--hover);}.export-menu button:disabled{opacity:.45;cursor:not-allowed;}.export-menu small{display:block;color:var(--text-secondary);font-size:11.5px;line-height:1.4;margin-top:4px;}
.folder-menu-row[hidden]{display:none;}
.folder-menu{max-height:70vh;overflow-y:auto;box-sizing:border-box;}
.folder-picker summary{list-style:none;max-width:100%;}.folder-picker summary::-webkit-details-marker{display:none;}
.folder-selected-name{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.folder-menu{position:absolute;top:calc(100% + 8px);left:0;width:340px;max-width:calc(100vw - 48px);z-index:35;padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--card);box-shadow:0 12px 36px rgba(0,0,0,.18);}
.folder-menu-list{max-height:280px;overflow-y:auto;margin:10px 0;}.folder-menu-row{display:flex;align-items:center;gap:5px;border-radius:8px;}.folder-menu-row:hover{background:var(--hover);}
.folder-menu-choice{display:flex;align-items:center;gap:8px;min-width:0;flex:1;text-align:left;padding:10px 7px;border:0;background:transparent;color:var(--text);font:inherit;font-size:13px;cursor:pointer;}.folder-menu-choice .folder-selected-name{flex:1;}.folder-menu-choice[aria-current="true"]{color:var(--blue-light);font-weight:600;}
.folder-favorite{border:0;background:transparent;color:var(--text-secondary);font-size:20px;cursor:pointer;padding:8px;}.folder-favorite[aria-pressed="true"]{color:var(--blue-light);}
.folder-menu-footer{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:10px;}
.folder-manager{width:560px;max-width:calc(100vw - 32px);max-height:80vh;border:1px solid var(--border);border-radius:16px;padding:20px;background:var(--card);color:var(--text);}.folder-manager::backdrop{background:rgba(0,0,0,.4);}.folder-manager-list{max-height:55vh;overflow-y:auto;}.folder-manager-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--border);}.folder-manager-name{flex:1;min-width:120px;overflow-wrap:anywhere;}
@media(max-width:600px){.folder-picker{flex-basis:100%;}.folder-menu{width:100%;max-width:100%;box-sizing:border-box;}.folder-selected-name{max-width:220px;}}
.folder-view{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:6px 10px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text-secondary);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
.folder-view:hover{background:var(--hover);color:var(--text);}.folder-view.active{border-color:var(--blue);color:var(--blue-light);background:color-mix(in srgb,var(--blue) 10%,var(--card));}
.folder-dot{width:8px;height:8px;border-radius:50%;background:var(--folder-color,var(--blue));flex:0 0 auto;}.folder-count{font-size:11px;color:var(--text-secondary);}
.bulk-select{min-width:170px;max-width:230px;padding:7px 9px;font-size:12.5px;}
.btn-danger{color:var(--error);border-color:color-mix(in srgb,var(--error) 42%,var(--border));}.btn-danger:hover{background:color-mix(in srgb,var(--error) 10%,transparent);border-color:var(--error);}
.funnel-board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:12px;overflow-x:auto;padding:2px 1px 12px;scrollbar-width:thin;}
.funnel-column{min-height:220px;border:1px solid var(--border);border-radius:12px;background:color-mix(in srgb,var(--card) 88%,var(--bg));padding:10px;}
.funnel-column-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 2px 10px;font-size:12.5px;font-weight:700;}
.funnel-card{border:1px solid var(--border);border-radius:10px;background:var(--card);padding:11px;margin-bottom:8px;box-shadow:0 1px 1px rgba(0,0,0,.04);}
.funnel-card:last-child{margin-bottom:0}.funnel-card:hover{border-color:color-mix(in srgb,var(--blue) 45%,var(--border));}
.timeline{position:relative;padding-left:20px}.timeline:before{content:"";position:absolute;left:6px;top:7px;bottom:7px;width:1px;background:var(--border);}
.timeline-item{position:relative;padding:0 0 14px}.timeline-item:last-child{padding-bottom:0}.timeline-item:before{content:"";position:absolute;left:-18px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px var(--card);}
.filter-scrim{position:fixed;inset:0;background:var(--scrim);z-index:110;animation:fadein .15s ease;}
.filter-drawer{position:fixed;right:0;top:0;bottom:0;width:min(440px,94vw);background:var(--bg);border-left:1px solid var(--border);z-index:120;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:drawerIn .2s ease;}
.filter-drawer-head{padding:20px 20px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.filter-drawer-body{padding:18px 20px;overflow:auto;flex:1;}
.filter-drawer-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;background:var(--topbar-bg);backdrop-filter:blur(10px);}
.filter-section{padding:0 0 18px;margin-bottom:18px;border-bottom:1px solid var(--border);}
.filter-section:last-child{border-bottom:0;margin-bottom:0;}
.filter-section-title{font-size:12px;font-weight:700;margin-bottom:10px;color:var(--text);text-transform:uppercase;letter-spacing:.045em;}
.filter-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:620px;}
.theme-option{border:2px solid var(--border);border-radius:14px;padding:10px;background:var(--card);cursor:pointer;text-align:left;color:var(--text);font:inherit;}
.theme-option.active{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 14%,transparent);}
.theme-preview{height:116px;border-radius:9px;margin-bottom:10px;overflow:hidden;display:grid;grid-template-columns:30% 70%;border:1px solid var(--border);}
.theme-preview.dark{background:#212121}.theme-preview.dark span:first-child{background:#171717}.theme-preview.dark span:last-child{margin:14px;background:#2f2f2f;border-radius:6px;}
.theme-preview.light{background:#fff}.theme-preview.light span:first-child{background:#f7f7f7;border-right:1px solid #e5e5e5}.theme-preview.light span:last-child{margin:14px;background:#fff;border:1px solid #e5e5e5;border-radius:6px;}
@keyframes drawerIn{from{transform:translateX(22px);opacity:.5}to{transform:translateX(0);opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

@media (max-width:960px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .hamburger{display:flex;}
  .search-box{display:none;}
  .content{padding:18px 16px 50px;}
.sidebar-scrim{display:none;position:fixed;inset:0;background:var(--scrim);z-index:45;}
  .sidebar-scrim.show{display:block;}
}
@media (max-width:680px){
  .opp-toolbar{align-items:stretch}.opp-search{min-width:100%;max-width:none}.opp-toolbar .toolbar-spacer{display:none}
  .filter-grid-2,.theme-grid{grid-template-columns:1fr}.page-title{font-size:21px}
}

/* ---------- login ---------- */
.login-shell{min-height:100vh;display:flex;}
.login-form-side{flex:1;display:flex;align-items:center;justify-content:center;padding:32px;}
.login-brand-side{flex:1;background:var(--surface);border-left:1px solid var(--border);display:flex;align-items:center;justify-content:center;padding:60px;position:relative;overflow:hidden;}
.login-brand-side::before{content:"";position:absolute;width:600px;height:600px;background:radial-gradient(circle,color-mix(in srgb,var(--blue) 16%,transparent),transparent 65%);top:-150px;right:-150px;}
.login-box{width:100%;max-width:380px;}
.demo-box{background:rgba(52,120,246,.08);border:1px dashed rgba(52,120,246,.4);border-radius:8px;padding:12px 14px;font-size:12.5px;color:var(--blue-light);margin-top:18px;cursor:pointer;}

/* ---------- onboarding ---------- */
.onb-shell{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px 80px;}
.onb-progress{width:100%;max-width:640px;display:flex;gap:8px;margin-bottom:36px;}

.onb-progress .seg.done{background:var(--blue);}
.onb-card{width:100%;max-width:640px;}
.step-badge{font-size:12px;color:var(--blue-light);font-weight:700;margin-bottom:6px;}

/* ---------- diagnosis ---------- */
.diag-header{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;}
.evidence-item{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;background:rgba(255,255,255,.012);}
.evidence-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin-top:8px;}
.tone-tabs{display:flex;gap:6px;margin-bottom:12px;}
.message-box{background:var(--input);border:1px solid var(--border);border-radius:10px;padding:16px;font-size:14px;line-height:1.55;}
.stepper-progress{display:flex;flex-direction:column;gap:14px;max-width:440px;margin:0 auto;}
.stepper-item{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--text-secondary);}
.stepper-item .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
.stepper-item.active{color:var(--text);}
.stepper-item.active .dot{border-color:var(--blue);}
.stepper-item.done .dot{background:var(--blue);border-color:var(--blue);}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
.kpi-val{font-size:24px;font-weight:700;font-family:inherit;margin-top:4px;}
.kpi-label{font-size:12.5px;color:var(--text-secondary);}
.kpi-trend{font-size:11.5px;margin-top:6px;color:var(--blue-light);}
.boot-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
.boot-spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--blue);animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.auth-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);color:#ff9a9a;font-size:12.5px;padding:10px 12px;border-radius:8px;margin-bottom:14px;}

<script>

/* ================= DATA MODEL ================= */
const SIGNAL_POOL = [
  {key:'semSite', texto:'Site não encontrado na fonte pública consultada', fonte:'Base pública de estabelecimentos', interpretacao:'Pode indicar uma oportunidade clara de criação ou estruturação da presença digital', servico:3},
  {key:'agendamento', texto:'Site não possui sistema de agendamento online visível', fonte:'Site institucional', interpretacao:'Pode indicar dificuldade na jornada de agendamento e possível perda de contatos interessados', servico:0},
  {key:'formulario', texto:'Formulário de contato apresentou erro ao ser testado', fonte:'Site institucional', interpretacao:'Pode indicar perda de leads que tentam iniciar contato pelo site', servico:1},
  {key:'perfilIncompleto', texto:'Perfil comercial possui informações incompletas (horário ou categoria)', fonte:'Perfil comercial', interpretacao:'Pode indicar presença digital sem manutenção recorrente', servico:4},
  {key:'avaliacaoDemora', texto:'Foram encontradas avaliações recentes mencionando demora no atendimento', fonte:'Avaliações públicas', interpretacao:'Pode indicar oportunidade de revisão no processo de atendimento ao cliente', servico:2},
  {key:'semResposta', texto:'Empresa não responde às avaliações recebidas', fonte:'Avaliações públicas', interpretacao:'Pode indicar reputação digital pouco aproveitada', servico:2},
  {key:'mobileRuim', texto:'Site apresenta baixa qualidade de navegação em dispositivos móveis', fonte:'Site institucional', interpretacao:'Pode indicar oportunidade de melhorar a experiência em dispositivos móveis', servico:3},
  {key:'semWhats', texto:'Canal de WhatsApp não está visível no site', fonte:'Site institucional', interpretacao:'Pode indicar dificuldade adicional na jornada de contato', servico:0},
  {key:'semPublicacao', texto:'Última publicação em redes sociais ocorreu há vários meses', fonte:'Redes sociais', interpretacao:'Pode indicar presença digital sem manutenção recorrente', servico:4},
];
const SERVICOS = [
  'Implementação de agendamento online integrado ao WhatsApp',
  'Revisão da jornada de agendamento e página de conversão',
  'Gestão de reputação e resposta a avaliações',
  'Redesign do site com foco em dispositivos móveis',
  'Plano de conteúdo e presença em redes sociais',
];
const OFFER_STAGES = [
  {key:'entrada', label:'1. Entrada', hint:'Diagnóstico ou primeira entrega'},
  {key:'principal', label:'2. Oferta principal', hint:'Solução central da operação'},
  {key:'expansao', label:'3. Expansão', hint:'Complemento ou próximo passo'},
  {key:'recorrencia', label:'4. Recorrência', hint:'Relacionamento contínuo'},
];
const OFFER_TYPES = {servico:'Serviço',produto:'Produto',software:'Software',recorrencia:'Recorrência'};
const BILLING_MODELS = {unico:'Pagamento único',mensal:'Mensal',anual:'Anual',sob_consulta:'Sob consulta'};
const COMMERCIAL_STAGES = ['Nova','Em análise','Priorizada','Abordagem preparada','Contatada','Respondeu','Reunião agendada','Cliente','Descartada'];
const CURATED_BUSINESS_CATEGORIES = [
  'Academia','Advogado','Agência de marketing','Arquiteto','Autoescola','Clínica de estética',
  'Clínica médica','Clínica odontológica','Construtora','Contabilidade','Corretora de imóveis',
  'Empresa de construção civil','Empresa de instalação elétrica','Empresa de limpeza','Empresa de mudanças',
  'Empresa de paisagismo','Empresa de segurança','Empresa de Terraplenagem','Escola','Escritório de advocacia',
  'Farmácia','Fornecedor de equipamentos industriais','Hotel','Imobiliária','Loja de materiais de construção',
  'Oficina mecânica','Restaurante','Salão de beleza','Serviço de entrega','Serviço de guindastes',
  'Serviço de logística','Serviço de manutenção','Serviço de transporte','Transportadora'
];
let radarCategories = null;
let radarOfferIds = null;

function classificacao(score){ if(score>=80) return {label:'Alto potencial', color:'var(--blue)'}; if(score>=60) return {label:'Potencial relevante', color:'var(--blue-light)'}; if(score>=40) return {label:'Acompanhar', color:'var(--warn)'}; return {label:'Baixa prioridade', color:'var(--text-secondary)'}; }
function potencialBand(score){ return score>=70?'alto':score>=40?'medio':'baixo'; }
function fmtDate(d){ return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtDateTime(value){ const d=new Date(value); return Number.isNaN(d.getTime())?'—':d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function normalizeText(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }
function formatCnpj(value){
  const clean=String(value||'').toUpperCase().replace(/[^0-9A-Z]/g,'').slice(0,14);
  if(clean.length!==14) return clean;
  return `${clean.slice(0,2)}.${clean.slice(2,5)}.${clean.slice(5,8)}/${clean.slice(8,12)}-${clean.slice(12)}`;
}

function formatOpeningHours(sourcePayload){
  const rows=sourcePayload&&Array.isArray(sourcePayload.openingHours) ? sourcePayload.openingHours : [];
  if(!rows.length) return 'Não informado';
  const dayNames={monday:'Seg',tuesday:'Ter',wednesday:'Qua',thursday:'Qui',friday:'Sex',saturday:'Sáb',sunday:'Domingo'};
  return rows.map(item=>{
    const day=dayNames[normalizeText(item&&item.day)] || String((item&&item.day)||'').slice(0,3);
    const hours=String((item&&item.hours)||'Não informado').replace(/\s+to\s+/gi,' às ').replace(/^closed$/i,'Fechado');
    return `${day}: ${hours}`;
  }).join(' · ');
}

// Reconstrói os sinais completos (texto, fonte, interpretação, serviço) a partir
// das chaves salvas no banco (empresas.sinais_keys), evitando duplicar esses textos no schema SQL.
function sinaisFromKeys(keys){ return (keys||[]).map(k=>SIGNAL_POOL.find(s=>s.key===k)).filter(Boolean); }

function offerIsDigital(offer){
  return /site|marketing|presen[cç]a digital|seo|rede social|whatsapp|landing page|tr[aá]fego/i.test([offer&&offer.nome,offer&&offer.resultado,offer&&offer.descricao].filter(Boolean).join(' '));
}

function contextualSignals(rawSignals, offer){
  const neutralized=rawSignals.map(signal=>{
    if(signal.key==='semSite') return Object.assign({},signal,{interpretacao:'O site não foi encontrado na fonte consultada. Isso limita os dados disponíveis, mas sozinho não comprova uma oportunidade comercial.'});
    if(signal.key==='semWhats') return Object.assign({},signal,{interpretacao:'O telefone não foi encontrado na fonte consultada. Isso dificulta o contato, mas sozinho não comprova necessidade de um produto específico.'});
    return signal;
  });
  if(!offer) return neutralized;
  const fit={
    key:'offerFit',
    texto:`Atividade pública compatível com o público-alvo de ${offer.nome}`,
    fonte:'Cruzamento com a oferta cadastrada',
    interpretacao:`A empresa atua em um segmento aderente a ${offer.nome}. O próximo passo é validar em conversa se existe necessidade de ${String(offer.resultado||'do resultado proposto').replace(/[.]$/,'').toLowerCase()}.`,
    servico:null,
  };
  const digital=offerIsDigital(offer);
  const relevantSignals=new Set(offer.sinais||[]);
  const adjusted=neutralized.map(signal=>{
    if(signal.key==='semSite'&&!digital&&!relevantSignals.has('semSite')) return Object.assign({},signal,{interpretacao:`O site não foi encontrado na fonte consultada, mas isso não comprova uma necessidade atendida por ${offer.nome} e não é a justificativa principal da recomendação.`});
    if(signal.key==='semWhats'&&!digital&&!relevantSignals.has('semWhats')) return Object.assign({},signal,{interpretacao:`O telefone não foi encontrado na fonte consultada. Esse dado reduz a facilidade de contato, mas não indica necessidade de ${offer.nome}.`});
    return signal;
  });
  return [fit,...adjusted];
}

function recommendationReason(offer, compatibility){
  if(!offer) return 'Oferta relacionada aos sinais públicos encontrados nesta empresa.';
  const result=String(offer.resultado||'').replace(/[.]$/,'');
  return `Aderência estimada em ${Number(compatibility)||0}% a partir da atividade e do público-alvo cadastrados.${result?` Resultado a validar: ${result}.`:''}`;
}

function publicSourceLabel(source){
  const normalized=normalizeText(source);
  if(!normalized) return 'Fonte pública verificada';
  if(normalized.includes('apify')||normalized.includes('google maps')||normalized.includes('google places')) return 'Perfil comercial público';
  return source;
}

function rowToOffer(row){
  return {
    id:row.id, nome:row.nome||'', resultado:row.resultado||'', descricao:row.descricao||'',
    ticketMin:row.ticket_min, ticketMax:row.ticket_max, ativo:row.ativo!==false,
    tipo:row.tipo||'servico', etapa:row.etapa||'principal', modeloCobranca:row.modelo_cobranca||'unico',
    publicoAlvo:row.publico_alvo||'', categorias:Array.isArray(row.categorias)?row.categorias:[],
    sinais:Array.isArray(row.sinais)?row.sinais:[], prioridade:Number(row.prioridade)||50,
    posicao:Number(row.posicao)||0,
  };
}

function formatOfferPrice(offer){
  const currency=value=>Number(value).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
  if(offer.ticketMin!=null&&offer.ticketMax!=null) return `${currency(offer.ticketMin)} a ${currency(offer.ticketMax)}`;
  if(offer.ticketMin!=null) return `A partir de ${currency(offer.ticketMin)}`;
  if(offer.ticketMax!=null) return `Até ${currency(offer.ticketMax)}`;
  return BILLING_MODELS[offer.modeloCobranca]||'Sob consulta';
}

// Converte uma linha da tabela `empresas` (+ suas `evidencias`) no formato que as telas usam.
function rowToCompany(row, evidenciaRows, latestAudit, offerMatch, folderIds, offerMatches, statusHistory){
  const rawSignals = sinaisFromKeys(row.sinais_keys);
  const sourceLabel=row.source_provider==='google_maps'?'Perfil comercial público':'Fonte pública verificada';
  if(!rawSignals.length) rawSignals.push({key:'perfilPublico', texto:'Estabelecimento localizado em uma fonte pública', fonte:sourceLabel, interpretacao:'Há dados públicos suficientes para iniciar uma qualificação comercial', servico:4});
  const offer=offerMatch&&offerMatch.offer;
  const sinais=contextualSignals(rawSignals,offer);
  const contextualMatch=offerMatch?Object.assign({},offerMatch,{motivo:offerMatch.motivo||recommendationReason(offer,offerMatch.compatibilidade)}):null;
  const legacyAgencyRecommendation=/cria[cç][aã]o de site|presen[cç]a digital|otimiza[cç][aã]o da presen[cç]a/i.test(row.servico_recomendado||'');
  const recommendedOffer=(offer&&offer.nome)||(!legacyAgencyRecommendation&&row.servico_recomendado)||'Nenhuma oferta compatível definida';
  const evidencias = (evidenciaRows||[]).map(e=>({
    texto:e.texto, fonte:publicSourceLabel(e.fonte),
    url:e.url_fonte||row.source_url||row.google_maps_url||'',
    data: e.data ? fmtDate(new Date(e.data+'T00:00:00')) : '',
    confianca:e.confianca,
  }));
  const sourcePayload=row.source_payload&&typeof row.source_payload==='object' ? row.source_payload : {};
  const collectedCategories=Array.isArray(sourcePayload.categories) ? sourcePayload.categories.filter(Boolean) : [];
  const completedAudit=latestAudit&&latestAudit.status==='concluido' ? latestAudit : null;
  const auditChecks=completedAudit&&completedAudit.checks&&typeof completedAudit.checks==='object' ? completedAudit.checks : {};
  const auditMetrics=completedAudit&&completedAudit.metrics||{};
  return {
    id:row.id, nome:row.nome, segmento:row.segmento, cidade:row.cidade, bairro:row.bairro, endereco:row.endereco,
    telefone:row.telefone, site:row.site, redes:row.redes||[], nota:row.nota, avaliacoes:row.avaliacoes,
    categorias:[...new Set([row.segmento,...collectedCategories].filter(Boolean))], sourcePayload,
    siteAudit:latestAudit||null,
    cnpjCandidates:Array.isArray(auditMetrics.cnpj_candidates)?auditMetrics.cnpj_candidates:[],
    publicChannels:collectedChannels(auditMetrics,completedAudit),
    score:row.score, confianca:row.confianca, potencial:row.potencial,
    sinais, evidencias,
    interpretacoes:[...new Set(sinais.map(s=>s.interpretacao))].slice(0,3),
    servicoRecomendado: recommendedOffer,
    offerRecommendation:contextualMatch,
    offerMatches:(offerMatches||[]).map(match=>Object.assign({},match,{motivo:match.motivo||recommendationReason(match.offer,match.compatibilidade)})),
    statusHistory:(statusHistory||[]).map(item=>({from:item.status_anterior,to:item.status_novo,at:item.changed_at,by:item.changed_by})),
    status: row.status,
    createdAt: row.created_at || null,
    analyzedAt: row.analisado_em || row.coletado_em || row.created_at || null,
    createdDate: row.created_at ? fmtDate(new Date(row.created_at)) : '',
    analysisDate: (row.analisado_em || row.coletado_em || row.created_at) ? fmtDate(new Date(row.analisado_em || row.coletado_em || row.created_at)) : '',
    ultimaAtualizacao: row.ultima_atualizacao ? fmtDate(new Date(row.ultima_atualizacao+'T00:00:00')) : '',
    resultado: row.resultado,
    monitorada: !!row.monitorada,
    archivedAt:row.archived_at||null,
    mergedInto:row.merged_into||null,
    folderIds:folderIds||[],
    mensagemGerada: row.mensagem_gerada, mensagemTom: row.mensagem_tom || 'consultivo', mensagemUtilizada: !!row.mensagem_utilizada,
    cnpj:row.cnpj||'', cnpjStatus:row.cnpj_status||'', cnpjActive:row.cnpj_active,
    cnpjLegalName:row.cnpj_legal_name||'', cnpjTradeName:row.cnpj_trade_name||'',
    cnpjCnaeCode:row.cnpj_cnae_code||'', cnpjCnaeDescription:row.cnpj_cnae_description||'',
    cnpjSize:row.cnpj_size||'', cnpjOpeningDate:row.cnpj_opening_date||null,
    cnpjIdentityScore:row.cnpj_identity_score, cnpjValidatedAt:row.cnpj_validated_at||null,
    perfil:{
      categoria:row.segmento || 'Não informada', horarios:formatOpeningHours(sourcePayload),
      respondeuAvaliacoes:null, completude:null,
    },
    siteInfo:{
      https: completedAudit ? auditChecks.https : (row.site ? /^https:\/\//i.test(row.site) : null),
      responsivo:completedAudit ? auditChecks.responsive : null,
      agendamento:completedAudit ? auditChecks.booking : null,
      whatsappVisivel:completedAudit ? auditChecks.whatsapp : null,
      formularioOk:completedAudit ? auditChecks.form : null,
      seoBasico:completedAudit ? auditChecks.seo : null,
    },
    avaliacoesInfo:{
      sentimento:null, temas:[],
    },
    jornada:{
      etapas:null, whatsapp:completedAudit?auditChecks.whatsapp:null, formulario:completedAudit?auditChecks.form:null, agendamentoOnline:completedAudit?auditChecks.booking:null,
    },
    presenca:{
      redesEncontradas:row.redes||[], frequencia:null,
    },
  };
}

function collectedChannels(metrics,audit){
  const channels=[];
  const add=(value,label)=>{
    try{
      const url=new URL(String(value));
      if(!['https:','http:','mailto:','tel:'].includes(url.protocol)) return;
      if(url.protocol==='mailto:'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(url.pathname)) return;
      if(url.protocol==='tel:'&&!/^\+?[\d()\s-]{8,25}$/.test(url.pathname)) return;
      if(!channels.some(item=>item.url===url.href)) channels.push({label,url:url.href,source:audit&&(audit.final_url||audit.url),at:audit&&(audit.finished_at||audit.created_at)});
    }catch(ignore){}
  };
  (Array.isArray(metrics.social_links)?metrics.social_links:[]).forEach(value=>{
    try{
      const host=new URL(value).hostname.toLowerCase();
      const names={'instagram.com':'Instagram','facebook.com':'Facebook','linkedin.com':'LinkedIn','tiktok.com':'TikTok','youtube.com':'YouTube','x.com':'X','twitter.com':'X'};
      const domain=Object.keys(names).find(key=>host===key||host.endsWith('.'+key));
      if(domain&&!/shar(e|er|ing)|intent/i.test(new URL(value).pathname)) add(value,names[domain]);
    }catch(ignore){}
  });
  (Array.isArray(metrics.whatsapp_links)?metrics.whatsapp_links:[]).forEach(value=>{
    try{ if(/(^|\.)(wa\.me|api\.whatsapp\.com|web\.whatsapp\.com)$/.test(new URL(value).hostname)) add(value,'WhatsApp'); }catch(ignore){}
  });
  (Array.isArray(metrics.email_links)?metrics.email_links:[]).forEach(value=>add(value,'E-mail'));
  (Array.isArray(metrics.phone_links)?metrics.phone_links:[]).forEach(value=>add(value,'Telefone'));
  return channels;
}

function possibleDuplicates(company,companies){
  const phone=value=>{
    let digits=String(value||'').replace(/\D/g,'');
    if(digits.length===12||digits.length===13) digits=digits.startsWith('55')?digits.slice(2):digits;
    return digits.length===10||digits.length===11?digits:'';
  };
  const domain=value=>{
    try{
      const host=new URL(/^https?:\/\//i.test(value)?value:'https://'+value).hostname.toLowerCase().replace(/^www\./,'');
      if(!host.includes('.')||/(^|\.)(google\.com|google\.com\.br|facebook\.com|instagram\.com|wa\.me|linkedin\.com|linktr\.ee|wixsite\.com|wordpress\.com|sites\.google\.com)$/.test(host)) return '';
      return host;
    }catch(ignore){ return ''; }
  };
  const compact=value=>normalizeText(value).replace(/[^a-z0-9]/g,'');
  const companyDomain=domain(company.site||'');
  const companyPhone=phone(company.telefone);
  return companies.filter(other=>other.id!==company.id&&!other.archivedAt).map(other=>{
    const reasons=[];
    if(company.cnpj&&other.cnpj===company.cnpj) reasons.push('Mesmo CNPJ');
    if(companyDomain&&domain(other.site||'')===companyDomain) reasons.push('Mesmo domínio do site');
    if(companyPhone&&phone(other.telefone)===companyPhone) reasons.push('Mesmo telefone');
    if(compact(company.nome).length>=4&&compact(company.nome)===compact(other.nome)&&compact(company.endereco).length>=10&&compact(company.endereco)===compact(other.endereco)) reasons.push('Mesmo nome e endereço');
    return {company:other,reasons};
  }).filter(item=>item.reasons.length);
}

function companyLocation(company){
  return company.bairro || company.cidade || company.endereco || 'Não informado';
}

function externalSiteLink(site){
  if(!site) return '<span class="muted">Não informado</span>';
  const normalized=/^https?:\/\//i.test(site) ? site : 'https://'+site;
  try{
    const parsed=new URL(normalized);
    if(!['http:','https:'].includes(parsed.protocol)) throw new Error('Protocolo inválido');
    return `<a href="${esc(parsed.href)}" target="_blank" rel="noopener noreferrer" style="color:var(--blue-light);text-decoration:none;overflow-wrap:anywhere;">${esc(site)} ↗</a>`;
  }catch(ignore){
    return esc(site);
  }
}

async function loadAllData(userId){
  const {data:{session}}=await sb.auth.getSession();
  const authId=session&&session.user.id||userId;
  const {data:accountOwner}=await sb.rpc('current_account_id');
  const {data:canWrite}=await sb.rpc('current_account_can_write');
  userId=accountOwner||authId; // Compatible with the existing installation until SQL is applied.
  const [{data:profile}, {data:settings}, {data:radaresRows}, {data:empresasRows}, {data:evidenciasRows}, {data:siteAuditRows}, {data:offerRows}, {data:offerMatchRows}, {data:folderRows}, {data:folderLinkRows}, {data:statusHistoryRows}, {data:adminMarker}, {data:integrationRows}, {data:scoreRows}] = await Promise.all([
    sb.from('profiles').select('*').eq('id', authId).maybeSingle(),
    sb.from('account_settings').select('*').eq('user_id', userId).maybeSingle(),
    sb.from('radares').select('*').eq('user_id', userId).order('criado_em', {ascending:false}),
    sb.from('empresas').select('*').eq('user_id', userId).order('score', {ascending:false}),
    sb.from('evidencias').select('*').order('data', {ascending:false}),
    sb.from('site_audits').select('*').eq('user_id', userId).order('created_at', {ascending:false}),
    sb.from('offers').select('*').eq('user_id', userId).order('posicao', {ascending:true}),
    sb.from('company_offer_matches').select('*,offer:offers(*)').eq('user_id', userId).order('created_at', {ascending:false}),
    sb.from('opportunity_folders').select('*').eq('user_id', userId).order('updated_at', {ascending:false}),
    sb.from('opportunity_folder_companies').select('folder_id,empresa_id').eq('user_id', userId),
    sb.from('company_status_history').select('empresa_id,status_anterior,status_novo,changed_by,changed_at').eq('user_id', userId).order('changed_at', {ascending:false}),
    sb.from('platform_admins').select('user_id').eq('user_id', authId).maybeSingle(),
    sb.from('platform_integrations').select('key,display_name,description,connected,sort_order').order('sort_order', {ascending:true}),
    sb.from('score_components').select('empresa_id,dimensao,pontos,maximo,explicacao,calculado_em').eq('user_id',userId).order('calculado_em',{ascending:false}),
  ]);
  const evByEmpresa = {};
  (evidenciasRows||[]).forEach(e=>{ (evByEmpresa[e.empresa_id] = evByEmpresa[e.empresa_id]||[]).push(e); });
  const auditsByEmpresa={};
  (siteAuditRows||[]).forEach(audit=>{ (auditsByEmpresa[audit.empresa_id]=auditsByEmpresa[audit.empresa_id]||[]).push(audit); });
  const latestAuditByEmpresa={};
  Object.entries(auditsByEmpresa).forEach(([empresaId,audits])=>{
    latestAuditByEmpresa[empresaId]=audits.find(audit=>['pendente','processando'].includes(audit.status))||audits.find(audit=>audit.status==='concluido')||audits[0];
  });
  const matchesByEmpresa={};
  const newestMatchBatch={};
  (offerMatchRows||[]).forEach(match=>{
    const batch=match.analysis_batch||match.created_at;
    if(!newestMatchBatch[match.empresa_id]) newestMatchBatch[match.empresa_id]=batch;
    if(newestMatchBatch[match.empresa_id]!==batch) return;
    if(match.offer) match.offer=rowToOffer(match.offer);
    if(match.offer&&!match.offer.ativo) return;
    (matchesByEmpresa[match.empresa_id]=matchesByEmpresa[match.empresa_id]||[]).push(match);
  });
  const matchByEmpresa={};
  Object.entries(matchesByEmpresa).forEach(([empresaId,matches])=>{ matchByEmpresa[empresaId]=matches.find(match=>match.principal)||matches[0]; });
  const foldersByCompany={};
  (folderLinkRows||[]).forEach(link=>{ (foldersByCompany[link.empresa_id]=foldersByCompany[link.empresa_id]||[]).push(link.folder_id); });
  const historyByCompany={};
  (statusHistoryRows||[]).forEach(item=>{ (historyByCompany[item.empresa_id]=historyByCompany[item.empresa_id]||[]).push(item); });
  const companies = (empresasRows||[]).map(row => rowToCompany(row, evByEmpresa[row.id], latestAuditByEmpresa[row.id], matchByEmpresa[row.id], foldersByCompany[row.id], matchesByEmpresa[row.id], historyByCompany[row.id]));
  const scoresByCompany={};
  (scoreRows||[]).forEach(item=>{ (scoresByCompany[item.empresa_id]=scoresByCompany[item.empresa_id]||[]).push(item); });
  companies.forEach(company=>{
    const rows=scoresByCompany[company.id]||[];
    company.scoreComponents=rows.length?rows.filter(item=>item.calculado_em===rows[0].calculado_em):[];
  });
  const ob = rowToOnboarding(settings) || state.onboarding;
  setState({
    userId,authUserId:authId,isAccountOwner:userId===authId,readOnly:userId!==authId&&canWrite!==true,
    user: { nome: (profile&&profile.nome) || state.user.nome, empresa: ob.empresa || state.user.empresa,
      plano: (profile&&profile.plano) || 'Plano Piloto', email: (profile&&profile.email) || '',
      cargo: (profile&&profile.cargo) || 'Head Comercial', isPlatformAdmin:!!adminMarker },
    onboarding: ob,
    onboarded: !!(settings && settings.onboarded),
    onboardStep: Math.max(1, Math.min(3, Number((settings&&settings.onboarding_step)||1))),
    companies,
    folders:(folderRows||[]).map(folder=>({id:folder.id,nome:folder.nome,cor:folder.cor||'#10a37f'})),
    integrations:(integrationRows||[]).map(item=>({key:item.key,name:item.display_name,description:item.description,connected:!!item.connected})),
    offers:(offerRows||[]).map(rowToOffer),
    radars: (radaresRows||[]).map(r=>({id:r.id, nome:r.nome, segmento:r.segmento, cidade:r.cidade, query:r.query, localizacao:r.localizacao, status:r.status||'pendente', criadoEm: r.criado_em ? fmtDate(new Date(r.criado_em+'T00:00:00')) : ''})),
    loggedIn:true, booting:false,
  });
}

async function updateCompanyStatus(company, nextStatus){
  if(!company||!nextStatus||company.status===nextStatus) return;
  const previousStatus=company.status;
  await persistCompanyField(company.id,{status:nextStatus});
  company.status=nextStatus;
  company.statusHistory=company.statusHistory||[];
  company.statusHistory.unshift({from:previousStatus,to:nextStatus,at:new Date().toISOString(),by:state.userId});
}

/* ================= AUTENTICAÇÃO (Supabase Auth) ================= */
async function bootAuth(){
  const { data: { session } } = await sb.auth.getSession();
  if(passwordRecoveryPending){
    const email=(session&&session.user&&session.user.email)||state.authEmail;
    const authError=session?'': 'Este link de recuperação expirou ou já foi utilizado. Solicite um novo link.';
    history.replaceState({},document.title,window.location.pathname);
    setState({ booting:false, authChecked:true, loggedIn:false, authMode:'update', authEmail:email, authError });
    return;
  }
  if(session && session.user){
    await loadAllData(session.user.id);
  } else {
    setState({ booting:false, authChecked:true, loggedIn:false });
  }
}
sb.auth.onAuthStateChange((event, session)=>{
  if(event === 'PASSWORD_RECOVERY'){
    passwordRecoveryPending=true;
    setState({ loggedIn:false, authMode:'update', authEmail:(session&&session.user&&session.user.email)||state.authEmail, authLoading:false, authError:null, booting:false });
  } else if(event === 'SIGNED_OUT'){
    setState({ loggedIn:false, onboarded:false, companies:[], radars:[], userId:null, booting:false });
  } else if(event === 'SIGNED_IN' && session && session.user){
    if(passwordRecoveryPending){
      setState({ loggedIn:false, authMode:'update', authEmail:session.user.email||state.authEmail, authLoading:false, authError:null, booting:false });
    } else if(state.authUserId !== session.user.id){
      loadAllData(session.user.id);
    }
  }
});


function toast(msg){
  const wrap = document.getElementById('toastWrap');
  if(!wrap) return;
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = `<span class="toast-check">${icon('check')}</span><span style="flex:1;line-height:1.4;">${esc(msg)}</span><span class="toast-bar"></span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(-6px)'; el.style.transition='opacity .25s, transform .25s'; setTimeout(()=>el.remove(),260); }, 3200);
}
function flashButton(btn, text){
  if(!btn) return;
  if(btn._flashTimer) clearTimeout(btn._flashTimer);
  if(!btn.dataset.originalHtml) btn.dataset.originalHtml = btn.innerHTML;
  const original = btn.dataset.originalHtml;
  btn.disabled = true;
  btn.classList.add('btn-flash');
  btn.innerHTML = icon('check') + ' ' + text;
  btn._flashTimer = setTimeout(()=>{
    btn.innerHTML = original;
    btn.disabled = false;
    btn.classList.remove('btn-flash');
    delete btn.dataset.originalHtml;
  }, 1500);
}

/* ================= SVG CHART HELPERS ================= */
function barChartSVG(data, opts){
  opts = opts||{}; const w=opts.w||560,h=opts.h||200,pad=32;
  const max = Math.max(...data.map(d=>d.v))*1.15 || 1;
  const bw = (w-pad*1.5)/data.length;
  let bars='', labels='';
  data.forEach((d,i)=>{
    const bh = (d.v/max)*(h-46);
    const x = pad + i*bw + bw*0.18;
    const y = h-30-bh;
    bars += `<rect x="${x}" y="${y}" width="${bw*0.64}" height="${bh}" rx="4" fill="${d.color||'var(--blue)'}"/>
      <text x="${x+bw*0.32}" y="${y-6}" font-size="10.5" fill="#87919C" text-anchor="middle" font-family="Inter">${d.v}</text>`;
    labels += `<text x="${x+bw*0.32}" y="${h-10}" font-size="10.5" fill="#87919C" text-anchor="middle" font-family="Inter">${d.label}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    <line x1="${pad}" y1="${h-30}" x2="${w-8}" y2="${h-30}" stroke="#1D3344"/>
    ${bars}${labels}
  </svg>`;
}
function lineChartSVG(data, opts){
  opts=opts||{}; const w=opts.w||560,h=opts.h||200,pad=30;
  const max = Math.max(...data.map(d=>d.v))*1.2||1, min=0;
  const stepX = (w-pad*1.4)/(data.length-1);
  const pts = data.map((d,i)=>{
    const x = pad+i*stepX;
    const y = h-30-((d.v-min)/(max-min))*(h-46);
    return [x,y];
  });
  const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = path + ` L${pts[pts.length-1][0]},${h-30} L${pts[0][0]},${h-30} Z`;
  let dots='', labels='';
  pts.forEach((p,i)=>{
    dots += `<circle cx="${p[0]}" cy="${p[1]}" r="3.4" fill="#3478F6"/>`;
    labels += `<text x="${p[0]}" y="${h-10}" font-size="10.5" fill="#87919C" text-anchor="middle" font-family="Inter">${data[i].label}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    <defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3478F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3478F6" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="${pad}" y1="${h-30}" x2="${w-8}" y2="${h-30}" stroke="#1D3344"/>
    <path d="${area}" fill="url(#lg1)" stroke="none"/>
    <path d="${path}" fill="none" stroke="#3478F6" stroke-width="2.4"/>
    ${dots}${labels}
  </svg>`;
}
function donutSVG(score, size){
  size = size||132; const r=size/2-10, c=2*Math.PI*r, cx=size/2, cy=size/2;
  const cls = classificacao(score);
  const off = c*(1-score/100);
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" stroke="#1D3344" stroke-width="11" fill="none"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" stroke="${cls.color}" stroke-width="11" fill="none"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="${size*0.26}" fill="var(--text)" class="donut-label" font-family="Inter">${score}</text>
    <text x="${cx}" y="${cy+18}" text-anchor="middle" font-size="10.5" fill="#87919C" font-family="Inter">/ 100</text>
  </svg>`;
}
function funnelSVG(stages){
  const w=760,h=stages.length*46+10; const max=stages[0].v;
  let out='';
  stages.forEach((s,i)=>{
    const pct = s.v/max;
    const barW = 200 + pct*(w-260);
    const y = i*46+8;
    out += `<rect x="0" y="${y}" width="${barW}" height="30" rx="6" fill="${i===0?'#3478F6':'rgba(102,163,255,'+(0.85-i*0.1)+')'}"/>
      <text x="14" y="${y+20}" font-size="12.5" fill="#04121e" font-weight="700" font-family="Inter">${s.label}</text>
      <text x="${barW+12}" y="${y+20}" font-size="12.5" fill="#F5F7FA" font-family="Inter">${s.v}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">${out}</svg>`;
}

function bindLogin(){
  document.querySelectorAll('[data-toggle-password]').forEach(btn=>btn.addEventListener('click',()=>{
    const input=document.getElementById(btn.getAttribute('data-toggle-password'));
    const visible=input.type==='text'; input.type=visible?'password':'text';
    btn.setAttribute('aria-label',visible?'Mostrar senha':'Ocultar senha'); btn.title=visible?'Mostrar senha':'Ocultar senha';
  }));
  const toggle=document.getElementById('toggleAuthMode');
  if(toggle) toggle.addEventListener('click', ()=>{
    setState({authMode: state.authMode==='signin' ? 'signup' : 'signin', authError:null});
  });
  const emailInput=document.getElementById('loginEmail');
  if(emailInput) emailInput.addEventListener('input',()=>{ state.authEmail=emailInput.value; });
  const forgot=document.getElementById('forgotPassword');
  if(forgot) forgot.addEventListener('click',()=>setState({authMode:'recover',authEmail:(emailInput&&emailInput.value)||state.authEmail,authError:null}));
  const requestNew=document.getElementById('requestNewRecovery');
  if(requestNew) requestNew.addEventListener('click',()=>{
    passwordRecoveryPending=false;
    setState({authMode:'recover',authError:null,authLoading:false});
  });
  document.getElementById('loginBtn').addEventListener('click', async ()=>{
    if(state.authMode==='update'){
      const pass=document.getElementById('newPass').value, confirm=document.getElementById('confirmPass').value;
      if(pass!==confirm){ setState({authError:'As senhas não coincidem.'}); return; }
      if(!validStrongPassword(pass)){ setState({authError:'Use 8 caracteres ou mais, com maiúscula, minúscula, número e símbolo.'}); return; }
      setState({authLoading:true,authError:null});
      const { error }=await sb.auth.updateUser({password:pass});
      if(error){ setState({authLoading:false,authError:traduzErroAuth(error.message)}); return; }
      passwordRecoveryPending=false;
      history.replaceState({},document.title,window.location.pathname);
      await sb.auth.signOut();
      setState({authMode:'signin',authLoading:false,authError:null,loggedIn:false});
      toast('Senha atualizada. Entre novamente com a nova senha.');
      return;
    }
    const email = document.getElementById('loginEmail').value.trim();
    if(state.authMode==='recover'){
      if(!email){ setState({authError:'Informe o e-mail da sua conta.'}); return; }
      setState({authLoading:true,authError:null});
      const redirectTo=window.location.origin+window.location.pathname;
      const { error }=await sb.auth.resetPasswordForEmail(email,{redirectTo});
      if(error){ setState({authLoading:false,authError:traduzErroAuth(error.message)}); return; }
      setState({authLoading:false,authMode:'signin',authError:null});
      toast('Se o e-mail estiver cadastrado, enviaremos um link de recuperação.');
      return;
    }
    const pass = document.getElementById('loginPass').value;
    if(!email || !pass){ setState({authError:'Preencha e-mail e senha.'}); return; }
    if(state.authMode==='signup'&&!validStrongPassword(pass)){ setState({authError:'Use 8 caracteres ou mais, com maiúscula, minúscula, número e símbolo.'}); return; }
    setState({authLoading:true, authError:null});
    try{
      if(state.authMode==='signup'){
        const nome = (document.getElementById('loginNome')||{}).value || '';
        if(pendingTeamInvite){
          const {data:registration,error:registrationError}=await sb.functions.invoke('register-invitation',{body:{token:pendingTeamInvite,email,name:nome,password:pass}});
          if(registrationError){
            let message='Não foi possível enviar o cadastro. Consulte o titular.';
            try{message=(await registrationError.context.json()).error||message;}catch{}
            throw new Error(message);
          }
          setState({authLoading:false,authMode:'signin',authError:null});
          toast(registration.message);
          const notice=document.createElement('p');notice.className='muted';notice.textContent=registration.message;
          document.getElementById('loginBtn').after(notice);
          return;
        }
        const { data, error } = await sb.auth.signUp({ email, password: pass, options:{ data:{ nome } } });
        if(error) throw error;
        if(data.session){
          await loadAllData(data.user.id);
          toast('Conta criada com sucesso. Bem-vindo(a)!');
        } else {
          setState({authLoading:false, authError:'Conta criada! Verifique seu e-mail para confirmar o acesso antes de entrar.'});
        }
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
        if(error) throw error;
        await loadAllData(data.user.id);
        toast('Bem-vindo de volta!');
      }
    }catch(e){
      setState({authLoading:false, authError: traduzErroAuth(e.message)});
    }
  });
}
function validStrongPassword(value){ return value.length>=8 && /[a-z]/.test(value) && /[A-Z]/.test(value) && /\d/.test(value) && /[^A-Za-z0-9]/.test(value); }
function traduzErroAuth(msg){
  if(!msg) return 'Não foi possível autenticar. Tente novamente.';
  if(/invalid login credentials/i.test(msg)) return 'E-mail ou senha incorretos.';
  if(/already registered|already exists/i.test(msg)) return 'Já existe uma conta com esse e-mail. Tente entrar.';
  if(/weak password|password.*(8|short)|characters/i.test(msg)) return 'Use 8 caracteres ou mais, com maiúscula, minúscula, número e símbolo.';
  if(/email not confirmed/i.test(msg)) return 'Confirme seu e-mail antes de entrar (verifique sua caixa de entrada).';
  return msg;
}

function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function bindOnboarding(){
  const ob = state.onboarding;
  const ids = {f_empresa:'empresa',f_site:'site',f_segmento:'segmento',f_cidade:'cidade',f_servico:'servico',f_ticket:'ticket',f_descricao:'descricao',f_problema:'problema',f_segdes:'segmentosDesejados',f_regiao:'regiao',f_palavras:'palavrasChave',f_qtd:'qtdOportunidades'};
  Object.keys(ids).forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', ()=>{ ob[ids[id]] = el.value; });
  });
  const porte = document.getElementById('f_porte');
  if(porte) porte.addEventListener('change', ()=>{ ob.porte = porte.value; });
  const back = document.getElementById('obBack');
  if(back) back.addEventListener('click', ()=> setState({onboardStep: Math.max(1, state.onboardStep-1)}));
  document.getElementById('obNext').addEventListener('click', async ()=>{
    const required = state.onboardStep===1 ? [ob.empresa,ob.servico,ob.problema] : state.onboardStep===2 ? [ob.segmentosDesejados,ob.regiao] : [];
    if(required.some(v=>!String(v||'').trim())){ toast('Preencha os campos principais para continuar.'); return; }
    const btn = document.getElementById('obNext');
    btn.disabled = true; btn.textContent = 'Salvando...';
    try{
      if(state.onboardStep<3){ state.onboardStep++; await persistOnboarding(false); setState({}); }
      else { await persistOnboarding(true); state.onboarded=true; navigate('#/radar'); setState({}); toast('Configuração salva. Agora execute seu primeiro radar.'); }
    }catch(e){
      btn.disabled=false; btn.textContent=state.onboardStep===3?'Configurar primeiro radar':'Salvar e continuar';
      toast('Não foi possível salvar agora. Tente novamente.');
    }
  });
}

function categoryCatalog(){
  const collected=state.companies.flatMap(company=>company.categorias||[company.segmento]);
  const unique=new Map();
  [...CURATED_BUSINESS_CATEGORIES,...collected].filter(Boolean).forEach(category=>{
    const key=normalizeText(category);
    if(key&&!unique.has(key)) unique.set(key,String(category).trim());
  });
  return [...unique.values()].sort((a,b)=>a.localeCompare(b,'pt-BR'));
}
function radarCategoryMatches(term){
  const query=normalizeText(term);
  const selected=new Set((radarCategories||[]).map(normalizeText));
  return categoryCatalog().filter(category=>!selected.has(normalizeText(category))&&(!query||normalizeText(category).includes(query))).slice(0,8);
}
function paintRadarCategoryPicker(){
  const chips=document.getElementById('rCategoryChips');
  if(chips) chips.innerHTML=(radarCategories||[]).map((category,index)=>`<span class="category-chip">${esc(category)}<button type="button" data-remove-category="${index}" aria-label="Remover ${esc(category)}">×</button></span>`).join('');
  paintRadarCategorySuggestions();
}
function paintRadarCategorySuggestions(){
  const input=document.getElementById('rCategoryInput');
  const list=document.getElementById('rCategorySuggestions');
  if(!input||!list) return;
  const matches=radarCategoryMatches(input.value);
  list.innerHTML=matches.map((category,index)=>`<div class="category-option ${index===0?'active':''}" data-category="${esc(category)}">${esc(category)}</div>`).join('');
  list.classList.toggle('show',document.activeElement===input&&matches.length>0);
}
function addRadarCategory(value){
  const category=String(value||'').trim();
  if(!category) return false;
  if((radarCategories||[]).some(item=>normalizeText(item)===normalizeText(category))) return true;
  if((radarCategories||[]).length>=5){ toast('Você pode pesquisar até 5 categorias por radar.'); return false; }
  radarCategories.push(category);
  const input=document.getElementById('rCategoryInput');
  if(input) input.value='';
  paintRadarCategoryPicker();
  return true;
}
function bindRadarCategoryPicker(){
  const picker=document.getElementById('rCategoryPicker');
  const input=document.getElementById('rCategoryInput');
  if(!picker||!input) return;
  paintRadarCategoryPicker();
  input.addEventListener('focus',paintRadarCategorySuggestions);
  input.addEventListener('input',paintRadarCategorySuggestions);
  input.addEventListener('keydown',event=>{
    if(event.key==='Enter'){
      event.preventDefault();
      const first=radarCategoryMatches(input.value)[0];
      addRadarCategory(first||input.value);
    }else if(event.key==='Backspace'&&!input.value&&radarCategories.length){
      radarCategories.pop(); paintRadarCategoryPicker();
    }else if(event.key==='Escape'){
      document.getElementById('rCategorySuggestions').classList.remove('show');
    }
  });
  picker.addEventListener('click',event=>{
    const option=event.target.closest('[data-category]');
    const remove=event.target.closest('[data-remove-category]');
    if(option) addRadarCategory(option.getAttribute('data-category'));
    if(remove){ radarCategories.splice(Number(remove.getAttribute('data-remove-category')),1); paintRadarCategoryPicker(); }
    if(!remove) input.focus();
  });
}

function bindRadarProcessing(){
  bindRadarCategoryPicker();
  document.querySelectorAll('[data-radar-offer]').forEach(input=>input.addEventListener('change',()=>{
    radarOfferIds=Array.from(document.querySelectorAll('[data-radar-offer]:checked')).map(item=>item.value);
  }));
  const btn = document.getElementById('runRadar');
  if(!btn) return;
  btn.addEventListener('click', async ()=>{
    const nome=document.getElementById('rNome').value.trim();
    const categoryInput=document.getElementById('rCategoryInput');
    if(categoryInput&&categoryInput.value.trim()) addRadarCategory(categoryInput.value);
    const categories=(radarCategories||[]).slice();
    const segmento=categories.join(', ');
    const localizacao=document.getElementById('rLocalizacao').value.trim();
    const palavras=document.getElementById('rPalavras').value.trim();
    const limite=Number(document.getElementById('rQuantidade').value)||20;
    const raio=Number(document.getElementById('rRaio').value)||15000;
    const selectedOfferIds=Array.from(document.querySelectorAll('[data-radar-offer]:checked')).map(item=>item.value);
    if(!nome||!categories.length||!localizacao){ toast('Informe o nome, ao menos uma categoria e a localização do radar.'); return; }
    if(!selectedOfferIds.length){ toast('Selecione ao menos um produto para o LeadScope recomendar.'); return; }
    const steps = ['Localizando empresas','Coletando perfis públicos','Organizando dados encontrados','Calculando potencial comercial','Preparando recomendações'];
    const wrap = document.getElementById('processingModalWrap');
    let i=0, timer;
    function paint(){
      wrap.innerHTML = `
      <div style="position:fixed;inset:0;background:rgba(3,6,10,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;">
        <div class="card" style="width:100%;max-width:420px;">
          <div class="card-title">Analisando oportunidades</div>
          <p class="card-sub">Isso pode levar alguns instantes.</p>
          <div class="stepper-progress">
            ${steps.map((s,idx)=>`
              <div class="stepper-item ${idx<i?'done':idx===i?'active':''}">
                <span class="dot">${idx<i?icon('check'):''}</span> ${s}
              </div>`).join('')}
          </div>
        </div>
      </div>`;
    }
    paint();
    timer=setInterval(()=>{ i=Math.min(i+1,steps.length-1); paint(); },900);
    try{
      const queries=categories.map(category=>[category,palavras].filter(Boolean).join(' '));
      const query=queries.join(' | ');
      const { data:radar, error:radarError }=await sb.from('radares').insert({
        user_id:state.userId,nome,segmento,cidade:localizacao,query,localizacao,raio_metros:raio,
        limite_resultados:limite,status:'pendente',fonte:'apify_google_maps'
      }).select().single();
      if(radarError) throw radarError;
      const {error:offerLinkError}=await sb.from('radar_offers').insert(selectedOfferIds.map(offerId=>({radar_id:radar.id,offer_id:offerId,user_id:state.userId})));
      if(offerLinkError) throw offerLinkError;
      const { data:startData, error:startError }=await sb.functions.invoke('search-places',{body:{action:'start',radar_id:radar.id,query:queries[0],queries,location:localizacao,result_limit:limite}});
      if(startError){
        let message=startError.message;
        if(startError.context&&typeof startError.context.json==='function'){
          try{ const details=await startError.context.json(); message=details.error||details.message||message; }catch(ignore){}
        }
        throw new Error(message);
      }
      if(startData&&startData.error) throw new Error(startData.error);
      if(!startData||!startData.run_id) throw new Error('A coleta não retornou uma identificação para acompanhamento.');

      let data=startData;
      const deadline=Date.now()+180000;
      while(data.status!=='concluido'){
        if(Date.now()>deadline) throw new Error('A coleta continua processando. Consulte este radar novamente em alguns instantes.');
        await new Promise(resolve=>setTimeout(resolve,3000));
        const { data:statusData, error:statusError }=await sb.functions.invoke('search-places',{body:{action:'status',run_id:startData.run_id}});
        if(statusError){
          let message=statusError.message;
          if(statusError.context&&typeof statusError.context.json==='function'){
            try{ const details=await statusError.context.json(); message=details.error||details.message||message; }catch(ignore){}
          }
          throw new Error(message);
        }
        if(statusData&&statusData.error) throw new Error(statusData.error);
        data=statusData||{};
      }
      clearInterval(timer); wrap.innerHTML='';
      await loadAllData(state.userId);
      radarCategories=null;
      radarOfferIds=null;
      toast('Radar concluído: '+Number((data&&data.found)||0)+' empresas encontradas.');
      navigate('#/oportunidades');
    }catch(e){
      clearInterval(timer); wrap.innerHTML='';
      toast('Não foi possível concluir o radar: '+(e.message||'tente novamente.'));
    }
  });
}

function companyListBase(){
  if(companyListScope()==='monitoradas')return state.companies.filter(c=>c.monitorada);
  if(companyListScope()==='diagnostico')return state.companies.filter(c=>c.score!=null&&Number.isFinite(Number(c.score))&&c.analyzedAt);
  return state.companies;
}
function activateCompanyList(){
  const scope=companyListScope();
  if(state.activeCompanyList!==scope){
    state.activeCompanyList=scope;state.selectedOpps=[];state.oppFilterOpen=false;
  }
}
function dateKey(value){ return value ? String(value).slice(0,10) : ''; }
function opportunityExportRows(mode){
  if(mode==='filtered')return opportunityDataset();
  if(mode!=='selected')throw new Error('Opção de exportação inválida.');
  const selected=new Set(state.selectedOpps);
  return companyListBase().filter(company=>selected.has(company.id));
}
function csvCell(value){
  let text=value==null?'':String(value);
  // CSV quoting alone does not prevent Excel/Sheets from executing formulas.
  if(/^[\s\u0000-\u001f]*[=+\-@＝＋－＠]/u.test(text))text="'"+text;
  return '"'+text.replace(/"/g,'""')+'"';
}
function buildCompanyCsv(companies){
  const headers=['Empresa','Segmento','Cidade','Bairro','Endereço','Telefone','Site','CNPJ','Situação do CNPJ','Score','Potencial','Produto ou serviço recomendado','Confiança','Status','Principal sinal','Pastas','Data de criação','Data de análise','Arquivada'];
  const rows=companies.map(c=>[
    c.nome,c.segmento,c.cidade,c.bairro,c.endereco,c.telefone,c.site,c.cnpj?formatCnpj(c.cnpj):'',c.cnpjStatus,
    c.score,({alto:'Alto',medio:'Médio',baixo:'Baixo'})[c.potencial]||c.potencial,c.servicoRecomendado,c.confianca,c.status,
    c.sinais?.[0]?.texto,(c.folderIds||[]).map(id=>state.folders.find(folder=>folder.id===id)?.nome).filter(Boolean).join(' | '),
    dateKey(c.createdAt),dateKey(c.analyzedAt),c.archivedAt?'Sim':'Não'
  ]);
  return '\ufeff'+[headers,...rows].map(row=>row.map(csvCell).join(';')).join('\r\n')+'\r\n';
}
function downloadCompanyCsv(mode){
  const companies=opportunityExportRows(mode);
  if(!companies.length){toast(mode==='selected'?'Selecione pelo menos uma empresa.':'Não há resultados para exportar nesta visualização.');return;}
  let url;
  try{
    const blob=new Blob([buildCompanyCsv(companies)],{type:'text/csv;charset=utf-8;'});
    url=URL.createObjectURL(blob);
    const anchor=document.createElement('a');anchor.href=url;
    anchor.download='leadscope-'+(mode==='selected'?'selecionadas':'filtradas')+'-'+new Date().toISOString().replace(/[:.]/g,'-')+'.csv';
    document.body.appendChild(anchor);
    try{anchor.click();}finally{anchor.remove();}
    document.getElementById('csvExportPicker').open=false;
    toast('Download iniciado: '+companies.length+' empresa'+(companies.length===1?'':'s')+'.');
  }catch{toast('Não foi possível iniciar a exportação. Tente novamente.');}
  finally{if(url)setTimeout(()=>URL.revokeObjectURL(url),30000);}
}
document.addEventListener('click',event=>{const picker=document.getElementById('csvExportPicker');if(event.target.isConnected&&picker?.open&&!picker.contains(event.target))picker.open=false;});
document.addEventListener('keydown',event=>{const picker=document.getElementById('csvExportPicker');if(event.key==='Escape'&&picker?.open){picker.open=false;picker.querySelector('summary').focus();}});
function normalizedText(value){ return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function companyOffer(c){
  if(c.offerRecommendation&&c.offerRecommendation.offer) return c.offerRecommendation.offer;
  return state.offers.find(offer=>offer.nome===c.servicoRecomendado)||null;
}
function activeCompanies(){ return companyListBase().filter(company=>!company.archivedAt); }
function folderCompanyCount(folderId){ return activeCompanies().filter(company=>(company.folderIds||[]).includes(folderId)).length; }
function folderFavorites(){
  try{const value=JSON.parse(localStorage.getItem('leadscope_folder_favorites_'+(state.authUserId||state.userId))||'[]');return Array.isArray(value)?value.filter(id=>state.folders.some(folder=>folder.id===id)).slice(0,3):[];}catch{return [];}
}
function folderSearchKey(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
